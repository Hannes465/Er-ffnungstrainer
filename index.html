<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eröffnungen">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#141518">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Eröffnungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
/* =====================================================================
   Eröffnungstrainer – Designsystem „Schachakademie“
   Graphit als Grund, warmes Elfenbein für helle Flächen und Text,
   Schachbrettgrün für Hauptaktionen, gedämpftes Kupfer für Akzente.
   ===================================================================== */
:root{
  /* Flächen */
  --bg:#141518; --bg-2:#18191d; --surface:#1e2025; --surface-2:#24272d; --raise:#2b2e35;
  --line:#30333a; --line-2:#3d414a;
  /* Text */
  --ink:#f2ecdf; --ink-2:#d2cbbd; --muted:#9c968b;
  /* Akzente */
  --green:#3f6b47; --green-hi:#4a7a52; --green-lo:#355b3c; --green-soft:#7fa37a;
  --copper:#c4875a; --copper-soft:rgba(196,135,90,.16);
  --ivory:#efe7d6;
  /* Status */
  --good:#7fb37a; --warn:#d9a441; --bad:#d75a4b;
  /* Brett */
  --sq-l:#ebe3d1; --sq-d:#7b9468; --pc-w:#fbf8f1; --pc-b:#25221e;
  --hl-last:rgba(222,186,92,.52); --hl-sel:rgba(196,135,90,.72); --hl-dot:rgba(20,21,24,.26);
  /* Zugbewertungen (wie chess.com) */
  --k-brill:#2fbfe0; --k-great:#3d6fd2; --k-best:#5bb67a; --k-good:#8ea67a; --k-book:#a8855f;
  --k-inacc:#eaa020; --k-mist:#e46a2c; --k-blund:#d63a30;
  /* Form */
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 1px 2px rgba(0,0,0,.25);
  --sh-2:0 10px 30px -12px rgba(0,0,0,.55);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chess:"Noto Sans Symbols 2","Apple Symbols","Segoe UI Symbol","DejaVu Sans",serif;
  --tap:44px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav";
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:var(--r-s)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}

/* ---------- Rahmen: Kopf, Inhalt, Navigation ---------- */
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background:var(--bg-2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--green);color:var(--ivory)}
.brand .mark .ic{width:18px;height:18px}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;
  font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap;background:var(--surface)}
.sync:hover{border-color:var(--line-2)}
.sync i{width:8px;height:8px;flex:none;border-radius:50%;background:var(--muted)}
@media (max-width:430px){.top .sync{padding:0;width:32px;justify-content:center}.top .sync span{display:none}}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i,.sync[data-s="loading"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--bad)}
main{grid-area:main;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{max-width:640px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}

.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg-2);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 2px;
  text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;min-width:0;transition:color .15s}
.tabs a span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs a .ic{width:22px;height:22px}
.tabs a:hover{color:var(--ink-2)}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;border-radius:2px;background:var(--copper)}
.tabs a[aria-current="page"] .ic{color:var(--copper)}

/* ---------- Typografie ---------- */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.phead h1,.ptitle{font-family:var(--sans);font-weight:700;font-size:28px;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.phead .sub{color:var(--muted);font-size:14px;margin-top:6px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ptitle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lead{color:var(--ink-2);font-size:15px;max-width:52ch}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.card-h h2,.card-h h3,.sect{font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.25;letter-spacing:-.01em}
.kicker{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;gap:16px;align-items:flex-end;text-align:right;flex:none}
.stat b{display:block;font-family:var(--sans);font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);
  font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.tag i{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted)}
.tag.w i{background:var(--pc-w)}.tag.b i{background:var(--pc-b)}

/* ---------- Karten und Listen ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh-1)}
.card.soft{background:var(--bg-2);box-shadow:none}
.grid2{display:grid;gap:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0;padding-top:2px}
.list small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.list .n{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 12px 10px}
.tile b{display:block;font-family:var(--sans);font-weight:600;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile b small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.bar{grid-column:1/-1;display:flex;gap:2px;height:6px;border-radius:4px;overflow:hidden;background:var(--bg)}
.bar i{display:block;height:100%;border-radius:4px}
.bar .m{background:var(--good)}.bar .l{background:var(--warn)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .lg-m{background:var(--good)}.legend .lg-l{background:var(--warn)}
details>summary{display:flex;align-items:center;gap:8px;min-height:var(--tap);cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--ink-2)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;margin-left:auto;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details>summary:hover{color:var(--ink)}
details.card{padding:4px 16px}
details.card[open]{padding-bottom:16px}
details p{font-size:14px;color:var(--ink-2)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-m);
  border:1px solid transparent;background:var(--green);color:var(--ivory);font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--green-hi)}
.btn:active{background:var(--green-lo);transform:translateY(1px)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.42;transform:none;background:var(--green)}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--raise);border-color:#4a4f59}
.btn.sec:active{background:var(--surface)}
.btn.sec:disabled{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:transparent;padding:0 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.danger.is-sure,.btn.is-sure{border-color:var(--bad);color:#ffd9d3;background:rgba(215,90,75,.16)}
.btn.is-hot{border-color:var(--copper);color:var(--ink);background:var(--copper-soft)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.grow{flex:1}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 140px}
.ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctrl .btn{padding:0 8px;font-size:14px;min-width:0}
.ctrl .btn span{overflow:hidden;text-overflow:ellipsis}
.ctrl.one{grid-template-columns:1fr}
@media (max-width:520px){.ctrl:not(.one) .btn{flex-direction:column;gap:3px;min-height:58px;font-size:12.5px;padding:6px 4px}.ctrl:not(.one) .btn span{white-space:normal;text-align:center;line-height:1.15}}
.link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:36px;padding:0;border:0;background:none;color:var(--copper);font-weight:600;font-size:14px;text-decoration:none}
.link:hover{color:#d89c70;text-decoration:underline;text-underline-offset:3px}
.link .ic{width:18px;height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;gap:3px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-2)}
.seg button{min-height:36px;border:0;border-radius:9px;background:none;padding:0 10px;font-size:13px;font-weight:600;color:var(--muted);transition:background-color .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}

/* ---------- Formulare ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.field{width:100%;height:var(--tap);border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--bg-2);padding:0 14px;font:inherit;font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.field:hover{border-color:#4a4f59}
.field:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft)}

/* ---------- Statuszeile ---------- */
.msg{display:flex;align-items:center;gap:12px;min-height:52px;border-radius:var(--r-m);padding:10px 14px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--line-2);font-size:15px;font-weight:500}
.msg i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.msg[data-k="ok"]{border-left-color:var(--good)}.msg[data-k="ok"] i{background:var(--good)}
.msg[data-k="err"]{border-left-color:var(--warn)}.msg[data-k="err"] i{background:var(--warn)}
.msg[data-k="you"]{border-left-color:var(--copper)}.msg[data-k="you"] i{background:var(--copper)}
.think{display:inline-block;width:14px;height:14px;flex:none;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--copper);animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.idea{border-left:3px solid var(--copper);font-size:14px;color:var(--ink-2)}
.idea b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.err{background:var(--warn)}.dots i.cur{background:var(--ink);box-shadow:0 0 0 3px rgba(242,236,223,.15)}

/* ---------- Bühne: Brett + Seitenbereich ---------- */
.stage{display:flex;flex-direction:column;gap:16px}
.boardcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.mat{display:flex;align-items:center;gap:10px;min-height:26px;font-size:13px}
.mat .who{font-weight:600;color:var(--ink-2);min-width:46px}
.mat .cap{font-family:var(--chess);font-size:18px;line-height:1;letter-spacing:-.12em;color:var(--muted)}
.mat .adv{font-weight:700;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.mat .pts{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}

/* ---------- Schachbrett ---------- */
.boardwrap{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.boardwrap.ev{grid-template-columns:20px minmax(0,1fr)}
.boardwrap.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;
  border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.35),var(--sh-2)}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.board{position:relative}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.arrows .a-eng{fill:rgba(47,110,214,.78)}
.arrows .a-user{fill:rgba(224,132,58,.82)}
.arrows .a-pre{fill:rgba(224,132,58,.55)}
.arrows .c-user{fill:none;stroke:rgba(224,132,58,.85);stroke-width:7}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::before{background:var(--hl-last)}
.sq.sel::before{background:var(--hl-sel)}
.sq.hint::before{box-shadow:inset 0 0 0 4px var(--copper);background:rgba(196,135,90,.3);animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:rgba(196,135,90,.08)}}
.sq.chk::before{background:radial-gradient(circle,rgba(215,58,48,.85) 0%,rgba(215,58,48,.35) 55%,transparent 72%)}
.sq.wrong::before{background:rgba(215,58,48,.62);animation:fade .7s forwards}
.sq.right::before{background:rgba(91,182,122,.6);animation:fade .8s forwards}
@keyframes fade{to{opacity:0}}
.sq.tgt::after{content:"";position:absolute;z-index:2;width:30%;height:30%;border-radius:50%;background:var(--hl-dot);pointer-events:none}
.sq.tgt.cap::after{width:92%;height:92%;background:none;border:max(4px,1.1cqw) solid var(--hl-dot)}
.co{position:absolute;z-index:2;font-size:max(9px,2.4cqw);font-weight:700;line-height:1;pointer-events:none}
.co.f{right:4%;bottom:4%}.co.r{left:4%;top:4%}
.sq.l .co{color:#5f7a50}.sq.d .co{color:#f1ead9}
.pc{position:relative;top:.1em;z-index:1;font-family:var(--chess);font-size:10.4cqw;line-height:1;pointer-events:none;transition:transform .22s ease}
.pc.w{color:var(--pc-w);-webkit-text-stroke:.45cqw #2a2622;paint-order:stroke fill;text-shadow:0 .35cqw .4cqw rgba(0,0,0,.28)}
.pc.b{color:var(--pc-b);-webkit-text-stroke:.2cqw #0d0c0b;text-shadow:0 0 .25cqw rgba(255,255,255,.32),0 .35cqw .4cqw rgba(0,0,0,.25)}
.pc.lift{opacity:.25}
.drag{position:fixed;margin-top:.1em;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);transition:none;-webkit-text-stroke-width:1.2px}

/* Bewertungsbalken: eigene Farbe unten */
.evbar{position:relative;border-radius:6px;overflow:hidden;background:var(--pc-b);box-shadow:0 0 0 1px var(--line-2)}
.evbar i{position:absolute;left:0;right:0;bottom:0;background:var(--pc-w);transition:height .5s ease}
.evbar.flip{background:var(--pc-w)}.evbar.flip i{background:var(--pc-b)}
.evbar span{position:absolute;left:0;right:0;z-index:1;font-size:9.5px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.evbar span.lo{bottom:4px;color:var(--pc-b)}.evbar.flip span.lo{color:var(--pc-w)}
.evbar span.hi{top:4px;color:var(--pc-w)}.evbar.flip span.hi{color:var(--pc-b)}

/* Vorschaubrett */
.mini{container-type:inline-size;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:84px;height:84px;flex:none;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.mini i{display:flex;align-items:center;justify-content:center;font-style:normal;line-height:1}
.mini i.l{background:var(--sq-l)}.mini i.d{background:var(--sq-d)}
.mini i.lm{box-shadow:inset 0 0 0 20px var(--hl-last)}
.mini b{position:relative;top:.1em;font-family:var(--chess);font-size:11cqw;font-weight:400}
.mini b.w{color:var(--pc-w);-webkit-text-stroke:.6cqw #2a2622;paint-order:stroke fill}
.mini b.b{color:var(--pc-b)}

/* Zugliste */
.moves{font-size:14px;line-height:1.9;font-variant-numeric:tabular-nums;color:var(--muted)}
.moves span{color:var(--ink);font-weight:600;white-space:nowrap}
.moves span.e{color:var(--warn)}

/* ---------- Ergebnis- und Auswahlkarten ---------- */
.result{border-color:var(--line-2)}
.result h2{font-family:var(--sans);font-weight:600;font-size:24px;line-height:1.1}
.result .rh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.result .ri{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;flex:none}
.result.ok .ri{background:rgba(127,179,122,.16);color:var(--good)}

const OP={};
OPENINGS.forEach(o=>{
  o.L=[];
  o.lines.forEach(src=>{
    const toks=src.match(/\{[^}]*\}|[^\s{]+/g)||[];
    const moves=[],notes=[];
    toks.forEach(t=>{ if(t[0]==='{'){notes[moves.length-1]=t.slice(1,-1)} else moves.push(t) });
    const g=new Chess();
    for(let i=0;i<moves.length;i++){
      const m=g.move(moves[i]);
      if(!m){console.error('Illegaler Zug',o.id,i,moves[i],src);return}
      moves[i]=m.san;
    }
    o.L.push({op:o.id,key:o.id+':'+moves.join(' '),moves,notes});
  });
  o.fig=VARS[o.id].fig;o.L.forEach((l,i)=>{l.name=VARS[o.id].n[i]||('Variante '+(i+1))});
  OP[o.id]=o;
});

const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
const START={p:8,n:2,b:2,r:2,q:1};
function material(g){
  const cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  g.board().forEach(r=>r.forEach(p=>{if(p&&p.type!=='k')cnt[p.color][p.type]++}));
  const pts=c=>Object.keys(cnt[c]).reduce((s,t)=>s+cnt[c][t]*VAL[t],0);
  // geschlagene Figuren der Farbe c (Umwandlungen werden ignoriert)
  const lost=c=>['q','r','b','n','p'].flatMap(t=>Array(Math.max(0,START[t]-cnt[c][t])).fill(t));
  return {w:pts('w'),b:pts('b'),lostW:lost('w'),lostB:lost('b')};
}
function matRow(who,color,m){
  const opp=color==='w'?'b':'w';
  const took=color==='w'?m.lostB:m.lostW; // was diese Seite geschlagen hat
  const diff=m[color]-m[opp];
  return '<div class="mat"><span class="who">'+who+'</span><span class="cap">'+took.map(t=>GLYPH[t]+'︎').join('')+'</span>'+
    (diff>0?'<b class="adv">+'+diff+'</b>':'')+'<span class="pts">'+m[color]+' Pkt.</span></div>';
}

/* ---------- Stockfish ---------- */
const SF_URL='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
const Eng={w:null,ready:null,q:Promise.resolve(),handler:null,
  init(){
    if(this.ready)return this.ready;
    this.ready=new Promise((res,rej)=>{
      try{
        const url=URL.createObjectURL(new Blob(["importScripts('"+SF_URL+"');"],{type:'application/javascript'}));
        const w=new Worker(url);this.w=w;
        const to=setTimeout(()=>rej(new Error('Stockfish lädt nicht')),30000);
        w.onmessage=e=>{const l=String(e.data);
          if(l==='uciok')w.postMessage('isready');
          else if(l==='readyok'&&!this.handler){clearTimeout(to);res()}
          else if(this.handler)this.handler(l)};
        w.onerror=()=>{clearTimeout(to);rej(new Error('Stockfish-Fehler'))};
        w.postMessage('uci');
      }catch(e){rej(e)}
    });
    this.ready.catch(()=>{this.ready=null});
    return this.ready;
  },
  // Ergebnis: best (UCI), cp aus Sicht der Seite am Zug, mate, pv (UCI-Liste)
  analyse(fen,o){
    o=typeof o==='number'?{ms:o}:(o||{});
    const run=()=>this.init().then(()=>new Promise(res=>{
      const lines={};
      this.handler=l=>{
        if(l.startsWith('info')&&l.includes(' pv ')&&l.includes('score ')){
          const cp=l.match(/score cp (-?\d+)/),mt=l.match(/score mate (-?\d+)/),k=l.match(/multipv (\d+)/);
          lines[k?+k[1]:1]={cp:cp?+cp[1]:0,mate:mt?+mt[1]:null,pv:l.split(' pv ')[1].trim().split(' ')};
        }else if(l.startsWith('bestmove')){
          this.handler=null;
          const b=l.split(' ')[1];
          const info=Object.assign({cp:0,mate:null,pv:[]},lines[1]);
          info.cand={};Object.values(lines).forEach(x=>{if(x.pv[0])info.cand[x.pv[0]]=cpOf(x)});
          res(Object.assign(info,{best:b&&b!=='(none)'?b:null}));
        }
      };
      this.w.postMessage('setoption name Skill Level value '+(o.skill==null?20:o.skill));
      this.w.postMessage('setoption name MultiPV value '+(o.multipv||3));
      this.w.postMessage('position fen '+fen);
      this.w.postMessage('go '+(o.depth?'depth '+o.depth+' ':'')+'movetime '+(o.ms||1500));
    }));
    const p=this.q.then(run,run);this.q=p.catch(()=>{});return p;
  }
};
// Bewertung in Zentibauern aus Sicht der Seite am Zug (Matt = ±10000)
const cpOf=a=>a.mate!==null?(a.mate>0?10000-a.mate*10:-10000-a.mate*10):a.cp;
const fmtEv=cp=>Math.abs(cp)>=9000?'M'+Math.max(1,Math.round((10000-Math.abs(cp))/10)):(cp>0?'+':cp<0?'−':'')+(Math.abs(cp)/100).toFixed(1);
function uciToMove(fen,u){const g=new Chess(fen);return g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'})}
function pvText(fen,pv,n){
  const g=new Chess(fen);const out=[];
  let num=+fen.split(' ')[5],w=g.turn()==='w';
  for(const u of pv.slice(0,n)){
    const m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(!m)break;
    out.push((w?num+'.':(out.length?'':num+'…'))+'<span>'+esc(de(m.san))+'</span>');
    if(!w)num++;w=!w;
  }
  return out.join(' ');
}

/* ---------- Trainer-Zustand: zwei Bretter (Üben und Partie) ---------- */
let GEN=0;
function newState(kind,view){return {kind,view,mode:null,pool:[],line:null,game:new Chess(),ply:0,side:'w',
  lineErr:0,hintUsed:false,shown:false,errHere:0,hintLvl:0,errAt:new Set(),sel:null,last:null,busy:false,finished:false,
  count:0,prevKey:null,msg:null,notes:[],phase:'line',play:null,evW:null,gen:0,result:null,level:null,over:null,sure:false}}
const TT=newState('train','v-ueben'),TG=newState('game','v-partie');
let T=TT; // das gerade sichtbare Brett
const live=S=>S===T&&!document.getElementById(S.view).hidden;
function paint(S){if(live(S))renderTrainer()}

function pick(pool,prev){
  const now=Date.now();
  // niedrige Stufe zuerst; gerade gespielte Linien etwas nach hinten; Zufall gegen Monotonie
  const scored=pool.map(l=>{const s=LS(l.key);return {l,score:s.box*10+(s.last&&now-s.last<6e5?4:0)+Math.random()*3}});
  scored.sort((a,b)=>a.score-b.score);
  let c=scored[0].l;
  if(c.key===prev&&scored.length>1)c=scored[1].l;
  return c;
}
function setPool(S,mode){
  const [id,i]=mode.split('#');
  if(id!=='mix'&&!OP[id])return false;
  S.mode=mode;
  S.pool=id==='mix'?OPENINGS.flatMap(o=>o.L):i==null?OP[id].L:[OP[id].L[+i]].filter(Boolean);
  return S.pool.length>0;
}
// mode: Eröffnungs-ID oder 'mix'; idx: einzelne Variante
function startMode(mode,idx){
  const S=TT;
  if(!setPool(S,idx==null?mode:mode+'#'+idx))return;
  S.count=0;
  try{localStorage.setItem(SK+'-mode',S.mode)}catch(e){}
  T=S;
  nextLine(S);
  if(location.hash!=='#ueben')location.hash='#ueben';else route();
}
function resetState(S,line){
  S.line=line;S.prevKey=line.key;S.side=OP[line.op].side;
  S.game.reset();S.ply=0;S.lineErr=0;S.hintUsed=false;S.shown=false;S.errHere=0;S.hintLvl=0;S.errAt=new Set();
  S.sel=null;S.last=null;S.finished=false;S.busy=false;S.notes=[];S.phase='line';S.play=null;S.evW=null;
  S.result=null;S.over=null;S.level=null;S.sure=false;S.gen=++GEN;
}
function nextLine(S,line){
  resetState(S,line||pick(S.pool,S.prevKey));
  S.count++;
  S.msg={k:'',t:S.side==='w'?'Du hast Weiß. Finde den ersten Zug.':'Du hast Schwarz. Weiß beginnt …'};
  if(S.kind==='game')saveGame(S);
  Eng.init().catch(()=>{});
  paint(S);
  opponent(S);
}
function bookMoves(S){
  // alle eigenen Repertoirezüge in dieser Stellung (über alle Linien derselben Eröffnung)
  const h=S.game.history();const set=new Map();
  OP[S.line.op].L.forEach(l=>{
    if(l.moves.length>h.length&&h.every((m,i)=>l.moves[i]===m)){if(!set.has(l.moves[h.length]))set.set(l.moves[h.length],l)}
  });
  return set;
}
const expected=S=>S.line.moves[S.ply];
function userTurn(S){
  if(S.phase==='review')return !!TA.gid&&!S.busy;
  if(!S.line||S.busy)return false;
  const g=S.game;
  if(S.phase==='line')return !S.finished&&g.turn()===S.side&&S.ply<S.line.moves.length;
  if(S.phase==='play')return g.turn()===S.side&&S.play.left>0&&!g.game_over();
  if(S.phase==='game')return g.turn()===S.side&&!S.over&&!g.game_over();
  return false;
}

function opponent(S){
  if(S.ply>=S.line.moves.length){finish(S);return}
  if(S.game.turn()===S.side){paint(S);return}
  S.busy=true;const gen=S.gen;
  setTimeout(()=>{
    if(gen!==S.gen)return;
    const san=expected(S);
    animateMove(S,san,()=>{
      if(gen!==S.gen)return;
      const m=S.game.move(san);S.last=[m.from,m.to];S.ply++;
      const n=S.line.notes[S.ply-1];
      if(n)S.notes.push({who:'Gegner',san:m.san,t:n});
      S.busy=false;
      if(S.kind==='game')saveGame(S);
      if(S.ply>=S.line.moves.length){finish(S);return}
      S.msg={k:'you',t:'Gegner spielt '+de(m.san)+'. Dein Zug.'};
      paint(S);
    });
  },S.ply===0?650:420);
}

function tryMove(from,to){
  const S=T;
  if(!userTurn(S))return;
  if(S.phase==='review'){reviewMove(from,to);return}
  if(S.phase==='play'){playMove(S,from,to);return}
  if(S.phase==='game'){gameMove(S,from,to);return}
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.game.undo();
  const book=bookMoves(S);
  const pk=S.line.op+'|'+S.game.fen().split(' ').slice(0,4).join(' ');
  P.pos[pk]=P.pos[pk]||{err:0,ok:0,op:S.line.op,h:S.game.history()};
  if(book.has(m.san)){
    if(expected(S)!==m.san){ // anderer Buchzug -> passende Linie übernehmen
      const h=S.game.history();
      const alt=OP[S.line.op].L.filter(l=>l.moves.length>h.length&&h.every((x,i)=>l.moves[i]===x)&&l.moves[h.length]===m.san);
      S.line=pick(alt);
    }
    S.game.move(m.san);S.last=[m.from,m.to];S.ply++;S.sel=null;
    P.pos[pk].ok++;P.tot.ok++;
    const n=S.line.notes[S.ply-1];
    S.notes=n?[{who:'Du',san:m.san,t:n}]:[];
    S.msg={k:'ok',t:(S.errHere?'Jetzt stimmt’s: ':'Richtig: ')+de(m.san)};
    S.errHere=0;S.hintLvl=0;
    save();
    if(S.kind==='game')saveGame(S);
    renderTrainer();flash(m.to,'right');
    opponent(S);
  }else{
    S.lineErr++;S.errHere++;S.errAt.add(S.ply);
    P.pos[pk].err++;P.tot.err++;save();
    S.sel=null;
    const exp=S.game.move(expected(S));S.game.undo();
    const lvl=Math.min(3,S.errHere);
    S.hintLvl=Math.max(S.hintLvl,lvl>=2?lvl-1:0);
    const t=S.errHere===1?de(m.san)+' ist nicht die Theorie hier. Nochmal!'
      :S.errHere===2?'Auch nicht. Tipp: Gesucht ist ein '+PNAME[exp.piece]+'zug.'
      :S.errHere===3?'Die richtige Figur ist jetzt markiert.'
      :'Noch nicht – du kannst dir den Zug zeigen lassen.';
    S.msg={k:'err',t};
    renderTrainer();flash(to,'wrong');
    const bw=inView('.boardwrap');if(bw){bw.classList.remove('shake');void bw.offsetWidth;bw.classList.add('shake')}
  }
}
function hint(){
  const S=T;
  if(S.phase!=='line'||!userTurn(S))return;
  S.hintUsed=true;
  S.hintLvl=Math.min(2,S.hintLvl+1);
  const exp=S.game.move(expected(S));S.game.undo();
  S.msg={k:'err',t:S.hintLvl===1?'Tipp: Gesucht ist ein '+PNAME[exp.piece]+'zug.':'Tipp: Diese Figur ist dran.'};
  renderTrainer();
}
function show(){
  const S=T;
  if(S.phase!=='line'||!userTurn(S))return;
  S.shown=true;S.errAt.add(S.ply);S.busy=true;
  const san=expected(S),gen=S.gen;
  animateMove(S,san,()=>{
    if(gen!==S.gen)return;
    const m=S.game.move(san);S.last=[m.from,m.to];S.ply++;S.busy=false;
    const n=S.line.notes[S.ply-1];
    S.notes=n?[{who:'Lösung',san:m.san,t:n}]:[];
    S.msg={k:'err',t:'Der Zug war '+de(m.san)+'. Merk ihn dir – die Linie kommt bald wieder.'};
    S.errHere=0;S.hintLvl=0;
    if(S.kind==='game')saveGame(S);
    paint(S);
    opponent(S);
  });
}
function finish(S){
  S.finished=true;
  if(S.kind==='game'){
    S.phase='pick';S.notes=[];
    S.msg={k:'ok',t:'Eröffnung geschafft! Wähle jetzt, wie stark der Bot spielen soll.'};
    saveGame(S);paint(S);
    const gen=S.gen,fen=S.game.fen();
    Eng.analyse(fen).then(a=>{if(gen!==S.gen||S.phase!=='pick')return;setEval(S,a,fen);paint(S)}).catch(()=>{});
    return;
  }
  const s=Object.assign({},LS(S.line.key));
  const perfect=S.lineErr===0&&!S.hintUsed&&!S.shown;
  s.seen++;s.last=Date.now();
  if(perfect){s.box=Math.min(5,s.box+1);s.perfect++}
  else s.box=S.shown?0:Math.max(0,s.box-1);
  P.lines[S.line.key]=s;
  const d=today();P.days[d]=(P.days[d]||0)+1;
  save();
  S.result={perfect,box:s.box};
  startPlay(S);
}

/* ---------- Üben: 2 Züge gegen Stockfish nach der Linie ---------- */
const PLAY_MOVES=2;
function setEval(S,a,fen){ // a = Analyse der Stellung fen; speichert Bewertung aus Sicht von Weiß
  const cp=cpOf(a);S.evW=fen.split(' ')[1]==='w'?cp:-cp;
}
function startPlay(S){
  const gen=S.gen;
  S.phase='play';S.busy=true;
  S.play={left:PLAY_MOVES,moves:[],pre:null,pv:null,pvFen:null,failed:false};
  S.msg={k:'',t:'Jetzt '+PLAY_MOVES+' Züge gegen Stockfish – ohne Theorie, jeder Zug wird bewertet.'};
  paint(S);
  const fen=S.game.fen();
  Eng.analyse(fen).then(a=>{
    if(gen!==S.gen)return;
    setEval(S,a,fen);
    if(S.game.turn()!==S.side)botMove(S,a);
    else{S.play.pre=a;S.busy=false;S.msg={k:'you',t:'Dein Zug – finde den besten Plan.'};paint(S)}
  }).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
}
function botMove(S,a){
  const gen=S.gen;
  if(!a.best){endPlay(S);return}
  const san=uciToMove(S.game.fen(),a.best).san;
  S.busy=true;
  setTimeout(()=>animateMove(S,san,()=>{
    if(gen!==S.gen)return;
    const m=S.game.move(san);S.last=[m.from,m.to];
    S.msg={k:'',t:'Stockfish spielt '+de(m.san)+' …'};
    paint(S);
    if(S.game.game_over()){endPlay(S);return}
    const fen=S.game.fen();
    Eng.analyse(fen).then(b=>{
      if(gen!==S.gen)return;
      setEval(S,b,fen);S.play.pre=b;S.busy=false;
      S.msg={k:'you',t:'Stockfish spielt '+de(m.san)+'. Dein Zug'+(S.play.left===1?' – der letzte.':'.')};
      paint(S);
    }).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
  }),350);
}
function playMove(S,from,to){
  const gen=S.gen;
  const before=S.game.fen(),pre=S.play.pre;
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.last=[m.from,m.to];S.sel=null;S.busy=true;S.play.left--;
  S.msg={k:'',t:'Stockfish prüft '+de(m.san)+' …'};
  paint(S);
  const fen=S.game.fen();
  const done=a=>{
    if(gen!==S.gen)return;
    const uci=m.from+m.to+(m.promotion||'');
    const bestCp=cpOf(pre);
    // Liegt der Zug unter Stockfishs Top-3, zählt dessen Wert aus derselben Suche (weniger Rauschen)
    const after=uci in pre.cand?pre.cand[uci]:a?-cpOf(a):(S.game.in_checkmate()?10000:0); // aus Sicht des Spielers
    const isBest=pre.best===uci;
    const loss=Math.max(0,bestCp-after);
    const r=isBest?[0,'Bester Zug','best']:RATE.find(x=>loss<=x[0]);
    const bestSan=!isBest&&loss>15&&pre.best?de(uciToMove(before,pre.best).san):null;
    S.play.moves.push({san:m.san,label:r[1],cls:r[2],loss,bestSan,after});
    if(a)setEval(S,a,fen);else S.evW=S.side==='w'?after:-after;
    if(live(S))flash(m.to,r[2]==='best'||r[2]==='good'||r[2]==='ok'?'right':'wrong');
    S.msg={k:r[2]==='inacc'||r[2]==='bad'?'err':'ok',t:de(m.san)+': '+r[1]+(bestSan?' – besser war '+bestSan:'')};
    if(!a||S.game.game_over()||S.play.left<=0){S.play.pv=a?a.pv:null;S.play.pvFen=fen;endPlay(S);return}
    paint(S);
    botMove(S,a);
  };
  if(S.game.game_over()){done(null);return}
  Eng.analyse(fen).then(done).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
}
function endPlay(S){
  S.phase='end';S.busy=false;
  paint(S);
}

/* ---------- Partie: Eröffnung nach Theorie, dann freie Partie gegen den Bot ---------- */
const LEVELS=[
  {n:'Anfänger',d:'macht viele Fehler',skill:0,depth:1,ms:100},
  {n:'Gelegenheitsspieler',d:'übersieht oft Taktik',skill:3,depth:3,ms:200},
  {n:'Vereinsspieler',d:'solide, mit Schwächen',skill:7,depth:6,ms:300},
  {n:'Fortgeschritten',d:'spielt sauber',skill:11,depth:10,ms:500},
  {n:'Stark',d:'kaum Fehler',skill:15,depth:14,ms:800},
  {n:'Meister',d:'sehr stark',skill:18,depth:18,ms:1200},
  {n:'Maximum',d:'volle Stockfish-Stärke',j:'Empfehlung: Beten',skill:20,depth:30,ms:1800}];
function startGame(id){
  const S=TG,L=OP[id].L;
  S.pool=L;S.count=0;T=S;
  nextLine(S,L[Math.floor(Math.random()*L.length)]); // der Bot wählt eine zufällige Variante
  if(location.hash!=='#partie')location.hash='#partie';else route();
}
function quitGame(S){clearGame();S.line=null;S.gen=++GEN;S.busy=false;paint(S)}
function chooseLevel(S,i){
  S.level=i;S.phase='game';saveGame(S);
  if(S.game.turn()!==S.side)gameBot(S);
  else{S.msg={k:'you',t:'Du bist am Zug. Viel Erfolg!'};paint(S)}
}
function gameMove(S,from,to){
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.last=[m.from,m.to];S.sel=null;S.sure=false;saveGame(S);
  if(checkOver(S))return;
  gameBot(S);
}
function gameBot(S){
  const gen=S.gen,L=LEVELS[S.level],fen=S.game.fen(),t0=Date.now();
  S.busy=true;S.msg={k:'',t:'Der Bot denkt …'};paint(S);
  Eng.analyse(fen,{ms:L.ms,depth:L.depth,skill:L.skill,multipv:1}).then(a=>{
    if(gen!==S.gen)return;
    setEval(S,a,fen);
    if(!a.best){S.busy=false;checkOver(S);return}
    const san=uciToMove(fen,a.best).san;
    setTimeout(()=>animateMove(S,san,()=>{
      if(gen!==S.gen)return;
      const m=S.game.move(san);S.last=[m.from,m.to];S.busy=false;saveGame(S);
      if(checkOver(S))return;
      S.msg={k:'you',t:'Bot spielt '+de(m.san)+(S.game.in_check()?' – Schach!':'.')+' Dein Zug.'};
      paint(S);
    }),Math.max(0,450-(Date.now()-t0)));
  }).catch(()=>{if(gen!==S.gen)return;S.busy=false;S.msg={k:'err',t:'Der Bot konnte nicht geladen werden (keine Verbindung?).'};paint(S)});
}
function checkOver(S,resigned){
  const g=S.game;let res=null,why='';
  if(resigned){res='loss';why='Aufgegeben'}
  else if(g.in_checkmate()){res=g.turn()===S.side?'loss':'win';why='Schachmatt'}
  else if(g.in_stalemate()){res='draw';why='Patt'}
  else if(g.in_threefold_repetition()){res='draw';why='Dreifache Stellungswiederholung'}
  else if(g.insufficient_material()){res='draw';why='Zu wenig Material zum Mattsetzen'}
  else if(g.in_draw()){res='draw';why='50-Züge-Regel'}
  if(!res)return false;
  S.over={res,why,id:Date.now()};S.busy=false;S.phase='over';S.sel=null;S.anaDone=false;
  if(why==='Schachmatt')S.evW=(res==='win')===(S.side==='w')?10000:-10000;
  P.games=P.games||[];
  P.games.push({id:S.over.id,d:today(),op:S.line.op,v:S.line.name,lvl:S.level,res,n:Math.ceil(g.history().length/2),moves:g.history(),side:S.side,book:S.line.moves.length});
  if(P.games.length>200)P.games=P.games.slice(-200);
  P.days[today()]=(P.days[today()]||0)+1;
  save();clearGame();
  S.msg={k:res==='loss'?'err':res==='win'?'ok':'',t:{win:'Gewonnen',loss:'Verloren',draw:'Remis'}[res]+' – '+why+'.'};
  paint(S);
  return true;
}
// laufende Partie überlebt Neuladen und App-Wechsel
function saveGame(S){
  if(!S.line||S.phase==='over')return;
  try{localStorage.setItem(SK+'-game',JSON.stringify({key:S.line.key,op:S.line.op,moves:S.game.history(),phase:S.phase,level:S.level}))}catch(e){}
}
function clearGame(){try{localStorage.removeItem(SK+'-game')}catch(e){}}
function restoreGame(){
  let g=null;try{g=JSON.parse(localStorage.getItem(SK+'-game')||'null')}catch(e){}
  if(!g||!OP[g.op])return;
  const line=OP[g.op].L.find(l=>l.key===g.key);if(!line){clearGame();return}
  const S=TG;S.pool=OP[g.op].L;resetState(S,line);S.count=1;
  for(const m of g.moves)if(!S.game.move(m)){clearGame();S.line=null;return}
  const h=S.game.history({verbose:true}),lm=h[h.length-1];if(lm)S.last=[lm.from,lm.to];
  S.ply=Math.min(g.moves.length,line.moves.length);
  S.phase=g.phase;S.level=g.level;S.finished=g.phase!=='line';
  S.msg={k:'you',t:'Deine Partie geht weiter.'};
  if(S.phase==='line')opponent(S);
  else if(S.phase==='pick')finish(S);
  else if(S.phase==='game'){
    if(S.game.turn()!==S.side)gameBot(S);
    else{const gen=S.gen,fen=S.game.fen();Eng.analyse(fen,{ms:800}).then(a=>{if(gen!==S.gen)return;setEval(S,a,fen);paint(S)}).catch(()=>{})}
  }
}

/* ---------- Brett ---------- */
const FILES='abcdefgh';
const inView=sel=>document.querySelector('#'+T.view+' '+sel);
const boardEl=()=>inView('.board');
function squares(){
  const out=[];
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rank=T.side==='w'?8-r:r+1, file=T.side==='w'?f:7-f;
    out.push(FILES[file]+rank);
  }
  return out;
}
function renderBoard(){
  const el=boardEl();if(!el)return;
  const g=T.game, sqs=squares();
  let hintSq=null;
  if(T.phase==='line'&&userTurn(T)&&T.hintLvl>=2){const e=g.move(expected(T));g.undo();hintSq=e.from}
  let checkSq=null;
  if(g.in_check())sqs.forEach(s=>{const p=g.get(s);if(p&&p.type==='k'&&p.color===g.turn())checkSq=s});
  const tg=new Map();
  if(T.sel)g.moves({square:T.sel,verbose:true}).forEach(m=>tg.set(m.to,!!m.captured));
  el.innerHTML=sqs.map((s,i)=>{
    const fi=FILES.indexOf(s[0]),ri=+s[1];
    const light=(fi+ri)%2===1;
    const p=g.get(s);
    let c='sq '+(light?'l':'d');
    if(T.last&&T.last.includes(s))c+=' last';
    if(T.sel===s)c+=' sel';
    if(hintSq===s)c+=' hint';
    if(checkSq===s)c+=' chk';
    if(tg.has(s))c+=' tgt'+(tg.get(s)?' cap':'');
    const col=i%8, row=Math.floor(i/8);
    return '<div class="'+c+'" data-s="'+s+'">'+
      (row===7?'<span class="co f">'+s[0]+'</span>':'')+(col===0?'<span class="co r">'+s[1]+'</span>':'')+
      (p?'<span class="pc '+p.color+'">'+GLYPH[p.type]+'︎</span>':'')+'</div>';
  }).join('');
  if(T.phase==='review')reviewDecorate();
  drawOverlay();
}
function sqEl(s){return inView('.sq[data-s="'+s+'"]')}
function flash(s,k){const e=sqEl(s);if(!e)return;e.classList.add(k);setTimeout(()=>e.classList.remove(k),900)}
function animateMove(S,san,done){
  if(!live(S)){done();return}
  const m=S.game.move(san);S.game.undo();
  const a=sqEl(m.from),b=sqEl(m.to);
  const pc=a&&a.querySelector('.pc');
  if(!pc||!b){done();return}
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  pc.style.transform='translate('+(rb.left-ra.left)+'px,'+(rb.top-ra.top)+'px)';
  pc.style.zIndex=5;
  setTimeout(done,240);
}
function squareAt(x,y){
  const el=boardEl();if(!el)return null;
  const r=el.getBoundingClientRect();
  if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return null;
  const c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  return squares()[w*8+c];
}
/* ---------- Pfeile und Kreise auf dem Brett ---------- */
// Eigene Zeichnungen gelten nur für die Stellung, in der sie gemacht wurden.
function drawing(){
  const fen=T.game.fen();
  if(!T.draw||T.draw.fen!==fen)T.draw={fen,arrows:[],circles:[]};
  return T.draw;
}
function clearDrawing(){const d=drawing();if(d.arrows.length||d.circles.length){d.arrows=[];d.circles=[];drawOverlay()}}
function toggleArrow(f,t){const d=drawing(),i=d.arrows.findIndex(a=>a.f===f&&a.t===t);if(i>=0)d.arrows.splice(i,1);else d.arrows.push({f,t})}
function toggleCircle(s){const d=drawing(),i=d.circles.indexOf(s);if(i>=0)d.circles.splice(i,1);else d.circles.push(s)}
// Bester Zug laut Stockfish (nur im Analysemodus)
function engineArrow(){
  if(T!==TA||!TA.gid)return null;
  const g=gameById(TA.gid);if(!g)return null;
  let u=null;
  if(TA.vr){const e=evCache[T.game.fen()];u=e&&e.best}
  else if(g.an)u=g.an.best[TA.k]||null;
  return u&&!T.game.game_over()?{f:u.slice(0,2),t:u.slice(2,4)}:null;
}
function sqCenter(s){const i=squares().indexOf(s);return [(i%8)*100+50,Math.floor(i/8)*100+50]}
function arrowPath(f,t){
  const [x1,y1]=sqCenter(f),[x2,y2]=sqCenter(t),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
  const sw=8,hw=21,hl=34,s0=22,tipX=x2-ux*12,tipY=y2-uy*12,bx=tipX-ux*hl,by=tipY-uy*hl,ax=x1+ux*s0,ay=y1+uy*s0;
  const P=(x,y)=>x.toFixed(1)+','+y.toFixed(1);
  return 'M'+P(ax+px*sw,ay+py*sw)+'L'+P(bx+px*sw,by+py*sw)+'L'+P(bx+px*hw,by+py*hw)+'L'+P(tipX,tipY)+'L'+P(bx-px*hw,by-py*hw)+'L'+P(bx-px*sw,by-py*sw)+'L'+P(ax-px*sw,ay-py*sw)+'Z';
}
function arrowsSVG(){
  const d=drawing(),eng=engineArrow();
  let s='';
  if(eng)s+='<path class="a-eng" d="'+arrowPath(eng.f,eng.t)+'"/>';
  d.circles.forEach(c=>{const [x,y]=sqCenter(c);s+='<circle class="c-user" cx="'+x+'" cy="'+y+'" r="44"/>'});
  d.arrows.forEach(a=>{s+='<path class="a-user" d="'+arrowPath(a.f,a.t)+'"/>'});
  if(adraw&&adraw.to&&adraw.to!==adraw.from)s+='<path class="a-user a-pre" d="'+arrowPath(adraw.from,adraw.to)+'"/>';
  return s?'<svg class="arrows" viewBox="0 0 800 800" aria-hidden="true">'+s+'</svg>':'';
}
function drawOverlay(){
  const el=boardEl();if(!el)return;
  const old=el.querySelector('svg.arrows');if(old)old.remove();
  el.insertAdjacentHTML('beforeend',arrowsSVG());
}

/* ---------- Ziehen, Tippen und Zeichnen ---------- */
// Züge: Figur ziehen oder antippen.
// Pfeile: Rechtsklick ziehen (Kreis: Rechtsklick auf ein Feld), Linksklick ziehen ab einem Feld ohne eigene Figur,
// am Handy: Finger kurz halten, dann ziehen.
let drag=null,adraw=null,pressT=null,tapClear=false;
function startArrow(s,kind){adraw={from:s,to:s,kind};drawOverlay()}
function onDown(e){
  if(T.phase==='review'&&e.target.closest('.sqb')){e.preventDefault();openWhy();return}
  const s=squareAt(e.clientX,e.clientY);if(!s)return;
  if(e.pointerType==='mouse'&&e.button===2){e.preventDefault();startArrow(s,'right');return}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const touch=e.pointerType!=='mouse';
  if(touch){clearTimeout(pressT);pressT=setTimeout(()=>longPress(s),380)}
  const can=userTurn(T),p=T.game.get(s),mc=T.phase==='review'?T.game.turn():T.side; // im Analysemodus zieht die Seite am Zug
  if(can&&T.sel&&s!==T.sel&&!(p&&p.color===mc)){clearTimeout(pressT);tryMove(T.sel,s);return}
  if(!can||!p||p.color!==mc){
    if(T.sel){T.sel=null;renderBoard()}
    if(!touch){e.preventDefault();startArrow(s,'left')}else tapClear=true;
    return;
  }
  e.preventDefault();
  const wasSel=T.sel===s;
  T.sel=s;renderBoard();
  const src=sqEl(s).querySelector('.pc');
  const ghost=src.cloneNode(true);ghost.classList.add('drag');
  ghost.style.fontSize=getComputedStyle(src).fontSize;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  document.body.appendChild(ghost);src.classList.add('lift');
  drag={from:s,ghost,src,wasSel,moved:false,x:e.clientX,y:e.clientY};
}
// Handy: lange gedrückt halten startet einen Pfeil statt eines Zugs
function longPress(s){
  pressT=null;tapClear=false;
  if(drag){if(drag.moved)return;drag.ghost.remove();drag.src.classList.remove('lift');drag=null;T.sel=null;renderBoard()}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  startArrow(s,'long');
}
window.addEventListener('pointermove',e=>onMove(e));
window.addEventListener('pointerup',e=>onUp(e));
window.addEventListener('pointercancel',e=>onUp(e));

function onMove(e){
  if(adraw){const s=squareAt(e.clientX,e.clientY);if(s&&s!==adraw.to){adraw.to=s;drawOverlay()}return}
  if(!drag)return;
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6){drag.moved=true;clearTimeout(pressT);pressT=null}
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
}
function onUp(e){
  clearTimeout(pressT);pressT=null;
  if(tapClear&&!adraw){tapClear=false;clearDrawing()}
  tapClear=false;
  if(adraw){
    const a=adraw;adraw=null;
    const s=squareAt(e.clientX,e.clientY)||a.to;
    if(s!==a.from)toggleArrow(a.from,s);
    else if(a.kind==='left')clearDrawing(); // einfacher Klick auf ein leeres Feld räumt auf
    else toggleCircle(s);
    drawOverlay();return;
  }
  if(!drag)return;
  const d=drag;drag=null;d.ghost.remove();d.src.classList.remove('lift');
  const s=squareAt(e.clientX,e.clientY);
  if(s&&s!==d.from){tryMove(d.from,s);return}
  if(!d.moved&&d.wasSel){T.sel=null}
  renderBoard();
}

function miniBoard(o){

  let out='';

function userCp(){return T.evW===null?0:(T.side==='w'?T.evW:-T.evW)}

/* ---------- Partie-Analyse ---------- */
// Bewertungsklassen im Stil von chess.com: Symbol + Farbe + Name (nie nur Farbe)
const CLS={
  brill:{s:'!!',n:'Brillant'},
  great:{s:'!',n:'Sehr guter Zug'},
  best:{s:'!',n:'Bester Zug'},
  good:{s:'',n:'Gut'},
  book:{s:'',n:'Theorie'},
  inacc:{s:'?!',n:'Ungenauigkeit'},
  mist:{s:'?',n:'Fehler'},
  blund:{s:'??',n:'Patzer'}};
const CLS_ORDER=['brill','great','best','good','book','inacc','mist','blund'];
const ANA_MS=700;
// Gewinnchance in % aus Sicht der Seite am Zug (Formel wie bei Lichess)
const winp=cp=>50+50*(2/(1+Math.exp(-0.00368208*Math.max(-2000,Math.min(2000,cp))))-1);
const accOf=drop=>Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*drop)-3.1669));
function matOf(g,c){let s=0;g.board().forEach(r=>r.forEach(p=>{if(p&&p.type!=='k')s+=(p.color===c?1:-1)*VAL[p.type]}));return s}
const gameById=id=>(P.games||[]).find(x=>x.id===id);

let AJ=null; // laufende Analyse {id,i,n,cancel}
function analyseGame(id){
  const g=gameById(id);if(!g||!g.moves||AJ)return;
  const job={id,i:0,n:g.moves.length+1,cancel:false};AJ=job;
  const c=new Chess(),fens=[c.fen()],ucis=[];
  g.moves.forEach(m=>{const x=c.move(m);ucis.push(x.from+x.to+(x.promotion||''));fens.push(c.fen())});
  const res=[];
  paintA();
  const step=()=>{
    if(job.cancel){AJ=null;paintA();return}
    if(job.i>=fens.length){finishAnalysis(g,fens,ucis,res);AJ=null;paintA(true);return}
    const fen=fens[job.i],pos=new Chess(fen);
    if(pos.game_over()){res.push({cp:pos.in_checkmate()?-10000:0,best:null,second:null,pv:[]});job.i++;paintA();step();return}
    Eng.analyse(fen,{ms:ANA_MS,multipv:2}).then(a=>{
      const cands=Object.values(a.cand).sort((x,y)=>y-x);
      res.push({cp:cpOf(a),best:a.best,second:cands.length>1?cands[1]:null,pv:(a.pv||[]).slice(0,2)});
      job.i++;paintA();step();
    }).catch(()=>{AJ=null;job.err=true;anaErr='Stockfish konnte nicht geladen werden (keine Verbindung?).';paintA(true)});
  };
  step();
}
let anaErr='';
function finishAnalysis(g,fens,ucis,res){
  const n=ucis.length,cls=[],drops=[];
  for(let i=0;i<n;i++){
    const before=res[i].cp,after=-res[i+1].cp;
    const wb=winp(before),wa=winp(after),drop=Math.max(0,wb-wa);
    let k;
    if(i<(g.book||0))k='book';
    else if(drop>=22)k='blund';
    else if(drop>=12)k='mist';
    else if(drop>=5)k='inacc';
    else{
      const isBest=ucis[i]===res[i].best||drop<=1;
      // Opfer: nach der besten Antwort des Gegners und unserer besten Rückantwort fehlt Material – und trotzdem steht man gut
      let sac=false;
      if(isBest&&wa>=45&&wb<=92){
        const c=new Chess(fens[i]),me=c.turn(),m0=matOf(c,me);
        c.move(g.moves[i]);
        for(const u of res[i+1].pv){if(!c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'}))break}
        sac=m0-matOf(c,me)>=2;
      }
      // einziger guter Zug: die zweitbeste Möglichkeit wäre deutlich schlechter gewesen
      const only=isBest&&res[i].second!==null&&wb-winp(res[i].second)>=15;
      k=sac?'brill':only?'great':isBest?'best':'good';
    }
    cls.push(k);drops.push(k==='book'?null:drop);
  }
  const acc=side=>{const d=drops.filter((x,i)=>x!==null&&(i%2===0?'w':'b')===side);return d.length?Math.round(d.reduce((s,x)=>s+accOf(x),0)/d.length):null};
  const opp=g.side==='w'?'b':'w';
  g.an={ev:res.map((r,i)=>{const cp=fens[i].split(' ')[1]==='w'?r.cp:-r.cp;return Math.max(-10000,Math.min(10000,cp))}),
    cls:cls.join(','),best:res.map(r=>r.best||''),acc:acc(g.side),accBot:acc(opp),
    blund:cls.filter((k,i)=>k==='blund'&&(i%2===0?'w':'b')===g.side).length};
  save();
}

  let s='<svg class="pchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(progView==='acc'?'Genauigkeit':'Patzer')+' pro Partie">';

function uciLine(fen,pv,n){const c=new Chess(fen),out=[];for(const u of (pv||[]).slice(0,n)){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(!m)break;out.push(m.san)}return out}
// Bewertung (Sicht Weiß) für eine beliebige Stellung, mit Zwischenspeicher
function evalFen(fen,done){
  if(evCache[fen]){done&&done();return}
  const c=new Chess(fen);
  if(c.game_over()){evCache[fen]={w:c.in_checkmate()?(c.turn()==='w'?-10000:10000):0,best:null,pv:[]};done&&done();return}
  Eng.analyse(fen,{ms:700,multipv:1}).then(a=>{const cp=cpOf(a);evCache[fen]={w:fen.split(' ')[1]==='w'?cp:-cp,best:a.best,pv:a.pv||[]};done&&done()}).catch(()=>{});
}
function openWhy(){
  const g=gameById(TA.gid);if(!g||!g.an||TA.vr||TA.k<1)return;
  const i=TA.k-1;
  if(TA.why&&TA.why.i===i){TA.why=null;renderAnalyse(true);return}
  TA.why={i,after:null,before:null};
  const before=posFen(g,i),after=posFen(g,i+1),w=TA.why;
  const redraw=()=>{if(TA.why===w&&!$('#v-analyse').hidden){const m=$('#main'),y=m.scrollTop;renderAnalyse(true);m.scrollTop=y}};
  redraw();
  const run=(fen,key)=>{
    const c=new Chess(fen);
    if(c.game_over()){w[key]={cp:c.in_checkmate()?-10000:0,pv:[],fen};redraw();return Promise.resolve()}
    return Eng.analyse(fen,{ms:1100,multipv:1}).then(a=>{w[key]={cp:cpOf(a),pv:a.pv||[],fen};redraw()});
  };
  run(after,'after').then(()=>run(before,'before')).catch(()=>{w.err=true;redraw()});
}

function whyCard(g,cls){

  const uv=(cp,fen)=>{const u=fen.split(' ')[1]===g.side?cp:-cp;return fmtEv(u)};
  let h='<div class="card why"><div class="card-h"><h3>'+badge(k)+' '+(bad?'Warum '+C.n.replace('Patzer','ein Patzer').replace('Fehler','ein Fehler').replace('Ungenauigkeit','ungenau')+'?':C.n)+'</h3>'+
    '<button class="btn ghost sm" id="b-whyx" title="Erklärung schließen" aria-label="Erklärung schließen">'+I('x')+'</button></div>';

// Bewertungsverlauf: Fläche = deine Gewinnchance, Punkte = Fehler/Patzer
function evGraph(g){
  const an=g.an,n=an.ev.length-1,W=520,H=90,cls=an.cls.split(',');
  const X=i=>n?i*W/n:0,Y=cp=>H-winp(g.side==='w'?cp:-cp)/100*H;
  let d='M0,'+H+' '+an.ev.map((cp,i)=>'L'+X(i).toFixed(1)+','+Y(cp).toFixed(1)).join(' ')+' L'+W+','+H+' Z';
  let s='<svg class="egraph" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Bewertungsverlauf der Partie"><rect width="'+W+'" height="'+H+'" class="eb"/><path d="'+d+'" class="ea"/>'+
    '<line x1="0" x2="'+W+'" y1="'+H/2+'" y2="'+H/2+'" class="em"/>'+
    '<line x1="'+X(TA.k)+'" x2="'+X(TA.k)+'" y1="0" y2="'+H+'" class="ec"/></svg>';
  let dots='';
  cls.forEach((k,i)=>{if(['mist','blund','brill','great'].includes(k))dots+='<i class="k-'+k+'" style="left:'+(X(i+1)/W*100)+'%;top:'+(Y(an.ev[i+1])/H*100)+'%"></i>'});
  return '<div class="egwrap">'+s+'<div class="egdots">'+dots+'</div><div class="tip" id="etip" hidden></div></div>';
}
function bindEvGraph(v,g){
  const w=v.querySelector('.egwrap');if(!w)return;
  const n=g.moves.length,tip=w.querySelector('#etip'),cls=g.an.cls.split(',');
  const at=e=>{const r=w.getBoundingClientRect();return Math.max(0,Math.min(n,Math.round((e.clientX-r.left)/r.width*n)))};
  w.addEventListener('pointermove',e=>{const k=at(e),r=w.getBoundingClientRect();tip.hidden=false;
    const ucp=g.side==='w'?g.an.ev[k]:-g.an.ev[k];

    tip.style.left=Math.max(0,Math.min(r.width-130,(e.clientX-r.left)-65))+'px'});

function mergeP(a,b){
  const ra=a.resetAt||0,rb=b.resetAt||0;
  if(ra!==rb){const w=ra>rb?a:b;return Object.assign(emptyP(),JSON.parse(JSON.stringify(w)))}
  const o=emptyP();if(ra)o.resetAt=ra;
  const keys=(x,y)=>new Set([...Object.keys(x||{}),...Object.keys(y||{})]);
  keys(a.lines,b.lines).forEach(k=>{const x=(a.lines||{})[k],y=(b.lines||{})[k];
    o.lines[k]=!x?y:!y?x:((y.seen>x.seen||(y.seen===x.seen&&y.last>x.last))?y:x)});
  keys(a.pos,b.pos).forEach(k=>{const x=(a.pos||{})[k],y=(b.pos||{})[k];
    o.pos[k]=!x?y:!y?x:Object.assign({},x,{err:Math.max(x.err,y.err),ok:Math.max(x.ok,y.ok)})});
  keys(a.days,b.days).forEach(k=>{o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  o.tot={ok:Math.max(a.tot?.ok||0,b.tot?.ok||0),err:Math.max(a.tot?.err||0,b.tot?.err||0)};
  const gm=new Map();[...(a.games||[]),...(b.games||[])].forEach(g=>{const x=gm.get(g.id);if(!x||(!x.an&&g.an))gm.set(g.id,g)});
  o.games=[...gm.values()].sort((x,y)=>x.id-y.id).slice(-200);
  return o;
}

    '<label class="lab" for="accMail">E-Mail<input class="field" id="accMail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off"></label>'+
    '<label class="lab" for="accPw">Passwort (mindestens 6 Zeichen)<input class="field" id="accPw" type="password" autocomplete="current-password"></label>'+
    '<div class="btnrow" style="margin-top:2px">'+btn(null,'login','Anmelden').replace('<button ','<button data-act="login" ')+btn(null,'userplus','Konto erstellen',{v:'sec'}).replace('<button ','<button data-act="signup" ')+'</div><p class="note" id="accMsg" role="status">'+esc(authMsg)+'</p></div>';
}
function bindKonto(){
  document.querySelectorAll('#konto [data-act]').forEach(b=>b.onclick=()=>kontoAct(b.dataset.act,b));
  document.querySelectorAll('#konto input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();kontoAct('login',document.querySelector('#konto [data-act="login"]'))}});
}
function kontoAct(act,b){
  const am=$('#accMsg');
  if(act==='login'||act==='signup'){
    const em=$('#accMail').value.trim(),pw=$('#accPw').value;
    if(!em||pw.length<6){am.textContent='Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.';return}
    b.disabled=true;am.textContent='Einen Moment …';
    (act==='login'?sbFetch('/auth/v1/token?grant_type=password','POST',{email:em,password:pw})
      :sbFetch('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),'POST',{email:em,password:pw}))
    .then(j=>{
      if(j&&j.access_token){setSession(j);authMsg='';startCloud()}
      else if(j&&j.identities&&j.identities.length===0)authMsg='Für diese Adresse gibt es schon ein Konto. Melde dich an.';
      else authMsg='Fast fertig: Öffne den Link in der E-Mail an '+em+' und melde dich danach hier an.';
      renderStats();
    },e=>{b.disabled=false;am.textContent=authErr(e)});
  }else if(act==='logout'){
    if(syncOn&&(dirty||flushing)){am.textContent='Es ist noch nicht alles gesichert. Bitte kurz warten und noch einmal abmelden.';clearTimeout(ft);sync();return}
    const ot=auth&&auth.access_token;if(ot)sbFetch('/auth/v1/logout','POST',null,ot).catch(()=>{});
    P=emptyP();saveLocal();try{localStorage.removeItem(SK+'-owner')}catch(e){}
    signedOut('Abgemeldet. Dein Fortschritt bleibt auf dem Server.');
  }
}
// Rückkehr aus der Bestätigungs-E-Mail: Supabase hängt die Sitzung an die Adresse an
function fromEmailLink(){
  const h=location.hash.slice(1);if(!/access_token=|error_description=/.test(h))return;
  const q=new URLSearchParams(h);
  history.replaceState(null,'',location.pathname+'#konto');
  if(q.get('error_description')){authMsg=q.get('error_description').replace(/\+/g,' ');return}
  const tk=q.get('access_token');
  sbFetch('/auth/v1/user','GET',null,tk).then(u=>{
    setSession({access_token:tk,refresh_token:q.get('refresh_token'),expires_at:q.get('expires_at'),expires_in:q.get('expires_in'),user:u});
    authMsg='E-Mail bestätigt – du bist angemeldet.';startCloud();route();
  },()=>{authMsg='E-Mail bestätigt. Melde dich jetzt an.';route()});
}
document.addEventListener('visibilitychange',()=>{
  if(!syncOn)return;
  if(document.hidden){if(dirty){clearTimeout(ft);sync()}}
  else if(!flushing)sync();
});
window.addEventListener('hashchange',route);
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&T.sel){T.sel=null;renderBoard()}
  if(T===TA&&TA.gid&&!$('#v-analyse').hidden&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const d=e.key==='ArrowRight'?1:-1;if(TA.vr)varGo(TA.vr.idx+d);else reviewGo(TA.k+d)}
  if(T===TA&&TA.vr&&e.key==='Escape'&&!$('#v-analyse').hidden)exitVar();
});
let lastMode=null;try{lastMode=localStorage.getItem(SK+'-mode')}catch(e){}
if(lastMode&&setPool(TT,lastMode)){TT.count=0;nextLine(TT)}
restoreGame();
$('#tabs').innerHTML=[['ueben','grid','Üben'],['liste','book','Eröffnungen'],['partie','swords','Partie'],['analyse','activity','Analyse'],['stats','bars','Fortschritt']]
  .map(([k,ic,l])=>'<a href="#'+k+'" data-v="'+k+'" title="'+l+'">'+I(ic)+'<span>'+l+'</span></a>').join('');
fromEmailLink();
route();
if(auth)startCloud();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
