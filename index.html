<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eröffnungen">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#131211">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Eröffnungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
/* Gleiche Marke wie das Trainingslog: warmes Anthrazit, Kreideweiß, ein roter Akzent. */
:root{
  --bg:#131211; --surface:#1c1a18; --sunk:#171514; --raise:#27231f; --ink:#f4f0ea; --muted:#a69e94; --line:#332f2a;
  --accent:#ff5a36; --on-accent:#1b0a05; --good:#5cc48d; --warn:#e6b450; --bad:#ff5a36;
  --sq-l:#d8cfc2; --sq-d:#7d7166; --pc-w:#fbf8f3; --pc-b:#1a1816;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i,.sync[data-s="loading"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted)}
.lab{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{max-width:560px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);
  font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-top:2px solid transparent;margin-top:-1px;min-width:0;white-space:nowrap}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sect{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:8px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.w{background:var(--ink);color:var(--bg)}
.tag.b{background:var(--bg);color:var(--ink);border:1px solid var(--muted)}

/* Trainer */
.trhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.trhead h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.trhead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.meta{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ink)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.err{background:var(--warn)}.dots i.cur{background:var(--ink)}

.boardwrap{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.boardwrap.ev{grid-template-columns:26px minmax(0,1fr)}
/* Bewertungsbalken: eigene Farbe unten */
.evbar{position:relative;border-radius:6px;overflow:hidden;background:var(--pc-b);border:1px solid var(--line)}
.evbar i{position:absolute;left:0;right:0;bottom:0;background:var(--pc-w);transition:height .5s ease}
.evbar.flip{background:var(--pc-w)}.evbar.flip i{background:var(--pc-b)}
.evbar span{position:absolute;left:0;right:0;font-size:10px;letter-spacing:-.02em;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;z-index:1}
.evbar span.lo{bottom:3px;color:var(--pc-b)}.evbar.flip span.lo{color:var(--pc-w)}
.evbar span.hi{top:3px;color:var(--pc-w)}.evbar.flip span.hi{color:var(--pc-b)}
.mat{display:flex;align-items:center;gap:8px;min-height:24px;font-size:13px}
.mat .who{color:var(--muted);font-weight:500;min-width:58px}
.mat .cap{font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",serif;font-size:19px;line-height:1;letter-spacing:-2px;color:var(--muted)}
.mat b{font-variant-numeric:tabular-nums;font-weight:600}
.mat .pts{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.play h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.rate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rate:first-of-type{border-top:0}
.rate .mv{font-family:var(--display);font-weight:800;font-size:20px;min-width:52px}
.rate .lb{font-weight:600}
.rate small{grid-column:2/-1;color:var(--muted);font-size:12px}
.rate .ev{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.r-best .lb,.r-good .lb{color:var(--good)}.r-ok .lb{color:var(--ink)}.r-inacc .lb{color:var(--warn)}.r-bad .lb{color:var(--bad)}
.pv{font-size:14px;line-height:1.7}
.pv span{font-weight:600}
.think{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.boardwrap.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,90,54,.32)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,90,54,.55)}
.sq.hint::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px var(--warn);background:rgba(230,180,80,.35);animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:rgba(230,180,80,.1)}}
.sq.wrong::before{content:"";position:absolute;inset:0;background:rgba(255,40,20,.6);animation:fade .7s forwards}
.sq.right::before{content:"";position:absolute;inset:0;background:rgba(92,196,141,.6);animation:fade .8s forwards}
@keyframes fade{to{opacity:0}}
.sq.tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(19,18,17,.28)}
.sq.tgt.cap::after{width:88%;height:88%;background:none;border:5px solid rgba(19,18,17,.28)}
.co{position:absolute;font-size:10px;font-weight:600;line-height:1;pointer-events:none}
.co.f{right:3px;bottom:2px}.co.r{left:3px;top:3px}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.pc{position:relative;z-index:1;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols2",serif;
  font-size:min(10.5vw,56px);line-height:1;pointer-events:none;transition:transform .22s ease}
.pc.w{color:var(--pc-w);-webkit-text-stroke:1.3px #1a1816;paint-order:stroke fill;text-shadow:0 2px 2px rgba(0,0,0,.25)}
.pc.b{color:var(--pc-b);-webkit-text-stroke:.6px #000;text-shadow:0 0 1px rgba(255,255,255,.35),0 2px 2px rgba(0,0,0,.25)}
.pc.lift{opacity:.25}
.drag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);transition:none}

.msg{min-height:52px;display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:500}
.msg i{flex:0 0 10px;height:10px;border-radius:50%;background:var(--muted)}
.msg[data-k="ok"] i{background:var(--good)}
.msg[data-k="err"]{border-color:var(--warn)}.msg[data-k="err"] i{background:var(--warn)}
.msg[data-k="you"] i{background:var(--ink)}
.idea{border-left:4px solid var(--accent);font-size:14px}
.idea b{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;display:block;margin-bottom:2px}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctrl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 4px;font-size:14px;font-weight:600}
.ctrl button.hot{border-color:var(--warn);color:var(--warn)}
.ctrl button:disabled{opacity:.35;cursor:default}
.moves{font-size:14px;line-height:1.7;font-variant-numeric:tabular-nums;color:var(--muted)}
.moves span{color:var(--ink);font-weight:600;white-space:nowrap}
.moves span.e{color:var(--warn)}
.done{border:2px solid var(--good)}
.done.meh{border-color:var(--warn)}
.done h2{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.done .row{margin-top:12px}
details summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";font-weight:600}
details[open] summary::before{content:"– "}
details p{font-size:14px;margin-top:6px}

/* Liste */
.op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.op h3{font-size:17px;font-weight:600;line-height:1.2}
.op .s{font-size:13px;color:var(--muted)}
.op .go{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bar{grid-column:1/-1;display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)}.bar .l{background:var(--warn)}
.mix{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;text-align:left;width:100%;
  background:var(--accent);color:var(--on-accent);border-radius:14px;padding:16px}
.mix b{display:block;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.mix span{font-size:13px;font-weight:500}
.mix .arr{font-family:var(--display);font-weight:800;font-size:34px}

/* Vorschaubild */
.mini{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:88px;height:88px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.mini i{display:flex;align-items:center;justify-content:center;font-style:normal;line-height:1}
.mini i.l{background:var(--sq-l)}.mini i.d{background:var(--sq-d)}
.mini i.lm{box-shadow:inset 0 0 0 20px rgba(255,90,54,.38)}
.mini b{font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",serif;font-size:10.5px;font-weight:400}
.mini b.w{color:var(--pc-w);-webkit-text-stroke:.5px #1a1816;paint-order:stroke fill}
.mini b.b{color:var(--pc-b)}
.opc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.opmain{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.info{display:flex;flex-direction:column;gap:5px;min-width:0}
.info h3{font-size:17px;font-weight:600;line-height:1.2}
.info .s{font-size:13px;color:var(--muted)}
.go{border:0;background:none;padding:8px 2px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.opc details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.vars{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.vars button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.vars .vn{min-width:0}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.m{background:var(--good)}.pips i.l{background:var(--warn)}
.opg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.opg .go{pointer-events:none}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvls button{position:relative;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.lvls b{hyphens:auto;-webkit-hyphens:auto}
.lvls button:last-child{grid-column:1/-1}
.lvls b{display:block;font-size:15px;font-weight:600}
.lvls span{font-size:12px;color:var(--muted)}
.lvls em{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--accent)}
.lvls i{position:absolute;right:10px;top:8px;font-style:normal;font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent)}
.ctrl.one{grid-template-columns:1fr}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,20,.75) 0%,rgba(255,40,20,.25) 60%,transparent 75%)}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}

/* Analyse */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:999px;color:#fff;font-family:var(--body);font-weight:800;font-size:12px;font-style:normal;line-height:1;letter-spacing:-.04em;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.badge.big{min-width:34px;height:34px;font-size:17px;flex:none}
.sqb{position:absolute;right:-4px;top:-4px;z-index:3;min-width:46%;height:46%;font-size:min(3.2vw,15px)}
.sq{overflow:visible}
.anote{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;min-height:56px}
.anote small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-size:16px}
.nav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.egwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;touch-action:none}
.egraph{display:block;width:100%;height:90px}
.egraph .eb{fill:var(--pc-b)}.egraph .ea{fill:var(--pc-w)}
.egraph .em{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.egraph .ec{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.egdots{position:absolute;inset:0;pointer-events:none}
.egdots i{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tip{position:absolute;top:6px;z-index:5;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.sumh,.sumr{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.sumh b{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.sumr b{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sumr span{display:flex;align-items:center;gap:8px}
.sumr.acc{border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:4px}
.sumr.acc b{font-family:var(--display);font-weight:800;font-size:22px}
.mvlist{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:14px;max-height:220px;overflow-y:auto}
.mvlist .mn{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.mvb{border:0;background:none;padding:3px 5px;border-radius:6px;font-weight:600}
.mvb i{font-style:normal;font-weight:800;margin-left:1px}
.mvb.cur{background:var(--ink);color:var(--bg)}
.pbar{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.rb.win{background:var(--good);color:#0c1a12}.rb.draw{background:var(--line);color:var(--ink)}.rb.loss{background:var(--bad);color:var(--on-accent)}
.meta .rb{margin-left:auto}
.glist li{display:block;padding:0}
.glist button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0}
.glist button:disabled{opacity:.5}
.gi small,.ga small{display:block;color:var(--muted);font-size:12px}
.ga{text-align:right}.ga b{font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.pchart{display:block;width:100%;height:auto;touch-action:none}
.pchart .grid{stroke:var(--line);stroke-width:1}
.pchart .tick{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.pchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pchart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.pchart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}

/* Fortschritt */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list small{display:block;color:var(--muted);font-size:12px}
.list .n{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.link{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.danger{border:1px solid var(--line);background:none;border-radius:10px;padding:9px 12px;font-size:14px;color:var(--muted)}
.danger[data-sure="1"]{border-color:var(--bad);color:var(--bad);font-weight:600}
</style>

/* ---------- Aufbereitung + Prüfung ---------- */
const OP={};
OPENINGS.forEach(o=>{
  o.L=[];
  o.lines.forEach(src=>{
    const toks=src.match(/\{[^}]*\}|[^\s{]+/g)||[];
    const moves=[],notes=[];
    toks.forEach(t=>{ if(t[0]==='{'){notes[moves.length-1]=t.slice(1,-1)} else moves.push(t) });
    const g=new Chess();
    for(let i=0;i<moves.length;i++){
      const m=g.move(moves[i]);
      if(!m){console.error('Illegaler Zug',o.id,i,moves[i],src);return}
      moves[i]=m.san;
    }
    o.L.push({op:o.id,key:o.id+':'+moves.join(' '),moves,notes});
  });
  o.fig=VARS[o.id].fig;o.L.forEach((l,i)=>{l.name=VARS[o.id].n[i]||('Variante '+(i+1))});
  OP[o.id]=o;
});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const de=san=>san.replace(/[NBRQ]/g,c=>({N:'S',B:'L',R:'T',Q:'D'}[c]));
const PNAME={p:'Bauern',n:'Springer',b:'Läufer',r:'Turm',q:'Damen',k:'Königs'};
const GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function moveText(moves,errIdx){
  return moves.map((m,i)=>(i%2===0?(i/2+1)+'.':'')+'<span'+(errIdx&&errIdx.has(i)?' class="e"':'')+'>'+esc(de(m))+'</span>').join(' ');
}
function mastery(lines){
  let m=0,l=0;lines.forEach(x=>{const b=LS(x.key).box;if(b>=3)m++;else if(LS(x.key).seen)l++});
  return {m,l,n:lines.length};
}

/* ---------- Material ---------- */
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
const START={p:8,n:2,b:2,r:2,q:1};
function material(g){
  const cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  g.board().forEach(r=>r.forEach(p=>{if(p&&p.type!=='k')cnt[p.color][p.type]++}));
  const pts=c=>Object.keys(cnt[c]).reduce((s,t)=>s+cnt[c][t]*VAL[t],0);
  // geschlagene Figuren der Farbe c (Umwandlungen werden ignoriert)
  const lost=c=>['q','r','b','n','p'].flatMap(t=>Array(Math.max(0,START[t]-cnt[c][t])).fill(t));
  return {w:pts('w'),b:pts('b'),lostW:lost('w'),lostB:lost('b')};
}
function matRow(who,color,m){
  const opp=color==='w'?'b':'w';
  const took=color==='w'?m.lostB:m.lostW; // was diese Seite geschlagen hat
  const diff=m[color]-m[opp];
  return '<div class="mat"><span class="who">'+who+'</span><span class="cap">'+took.map(t=>GLYPH[t]+'︎').join('')+'</span>'+
    (diff>0?'<b>+'+diff+'</b>':'')+'<span class="pts">'+m[color]+' Pkt.</span></div>';
}

/* ---------- Stockfish ---------- */
const SF_URL='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
const Eng={w:null,ready:null,q:Promise.resolve(),handler:null,
  init(){
    if(this.ready)return this.ready;
    this.ready=new Promise((res,rej)=>{
      try{
        const url=URL.createObjectURL(new Blob(["importScripts('"+SF_URL+"');"],{type:'application/javascript'}));
        const w=new Worker(url);this.w=w;
        const to=setTimeout(()=>rej(new Error('Stockfish lädt nicht')),30000);
        w.onmessage=e=>{const l=String(e.data);
          if(l==='uciok')w.postMessage('isready');
          else if(l==='readyok'&&!this.handler){clearTimeout(to);res()}
          else if(this.handler)this.handler(l)};
        w.onerror=()=>{clearTimeout(to);rej(new Error('Stockfish-Fehler'))};
        w.postMessage('uci');
      }catch(e){rej(e)}
    });
    this.ready.catch(()=>{this.ready=null});
    return this.ready;
  },
  // Ergebnis: best (UCI), cp aus Sicht der Seite am Zug, mate, pv (UCI-Liste)
  analyse(fen,o){
    o=typeof o==='number'?{ms:o}:(o||{});
    const run=()=>this.init().then(()=>new Promise(res=>{
      const lines={};
      this.handler=l=>{
        if(l.startsWith('info')&&l.includes(' pv ')&&l.includes('score ')){
          const cp=l.match(/score cp (-?\d+)/),mt=l.match(/score mate (-?\d+)/),k=l.match(/multipv (\d+)/);
          lines[k?+k[1]:1]={cp:cp?+cp[1]:0,mate:mt?+mt[1]:null,pv:l.split(' pv ')[1].trim().split(' ')};
        }else if(l.startsWith('bestmove')){
          this.handler=null;
          const b=l.split(' ')[1];
          const info=Object.assign({cp:0,mate:null,pv:[]},lines[1]);
          info.cand={};Object.values(lines).forEach(x=>{if(x.pv[0])info.cand[x.pv[0]]=cpOf(x)});
          res(Object.assign(info,{best:b&&b!=='(none)'?b:null}));
        }
      };
      this.w.postMessage('setoption name Skill Level value '+(o.skill==null?20:o.skill));
      this.w.postMessage('setoption name MultiPV value '+(o.multipv||3));
      this.w.postMessage('position fen '+fen);
      this.w.postMessage('go '+(o.depth?'depth '+o.depth+' ':'')+'movetime '+(o.ms||1500));
    }));
    const p=this.q.then(run,run);this.q=p.catch(()=>{});return p;
  }
};
// Bewertung in Zentibauern aus Sicht der Seite am Zug (Matt = ±10000)
const cpOf=a=>a.mate!==null?(a.mate>0?10000-a.mate*10:-10000-a.mate*10):a.cp;
const fmtEv=cp=>Math.abs(cp)>=9000?'M'+Math.max(1,Math.round((10000-Math.abs(cp))/10)):(cp>0?'+':cp<0?'−':'')+(Math.abs(cp)/100).toFixed(1);
function uciToMove(fen,u){const g=new Chess(fen);return g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'})}
function pvText(fen,pv,n){
  const g=new Chess(fen);const out=[];
  let num=+fen.split(' ')[5],w=g.turn()==='w';
  for(const u of pv.slice(0,n)){
    const m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(!m)break;
    out.push((w?num+'.':(out.length?'':num+'…'))+'<span>'+esc(de(m.san))+'</span>');
    if(!w)num++;w=!w;
  }
  return out.join(' ');
}
const RATE=[[15,'Top-Zug','best'],[40,'Sehr gut','good'],[80,'Gut','ok'],[150,'Ungenau','inacc'],[350,'Fehler','bad'],[1e9,'Grober Fehler','bad']];

/* ---------- Trainer-Zustand: zwei Bretter (Üben und Partie) ---------- */
let GEN=0;
function newState(kind,view){return {kind,view,mode:null,pool:[],line:null,game:new Chess(),ply:0,side:'w',
  lineErr:0,hintUsed:false,shown:false,errHere:0,hintLvl:0,errAt:new Set(),sel:null,last:null,busy:false,finished:false,
  count:0,prevKey:null,msg:null,notes:[],phase:'line',play:null,evW:null,gen:0,result:null,level:null,over:null,sure:false}}
const TT=newState('train','v-ueben'),TG=newState('game','v-partie');
let T=TT; // das gerade sichtbare Brett
const live=S=>S===T&&!document.getElementById(S.view).hidden;
function paint(S){if(live(S))renderTrainer()}

function pick(pool,prev){
  const now=Date.now();
  // niedrige Stufe zuerst; gerade gespielte Linien etwas nach hinten; Zufall gegen Monotonie
  const scored=pool.map(l=>{const s=LS(l.key);return {l,score:s.box*10+(s.last&&now-s.last<6e5?4:0)+Math.random()*3}});
  scored.sort((a,b)=>a.score-b.score);
  let c=scored[0].l;
  if(c.key===prev&&scored.length>1)c=scored[1].l;
  return c;
}
function setPool(S,mode){
  const [id,i]=mode.split('#');
  if(id!=='mix'&&!OP[id])return false;
  S.mode=mode;
  S.pool=id==='mix'?OPENINGS.flatMap(o=>o.L):i==null?OP[id].L:[OP[id].L[+i]].filter(Boolean);
  return S.pool.length>0;
}
// mode: Eröffnungs-ID oder 'mix'; idx: einzelne Variante
function startMode(mode,idx){
  const S=TT;
  if(!setPool(S,idx==null?mode:mode+'#'+idx))return;
  S.count=0;
  try{localStorage.setItem(SK+'-mode',S.mode)}catch(e){}
  T=S;
  nextLine(S);
  if(location.hash!=='#ueben')location.hash='#ueben';else route();
}
function resetState(S,line){
  S.line=line;S.prevKey=line.key;S.side=OP[line.op].side;
  S.game.reset();S.ply=0;S.lineErr=0;S.hintUsed=false;S.shown=false;S.errHere=0;S.hintLvl=0;S.errAt=new Set();
  S.sel=null;S.last=null;S.finished=false;S.busy=false;S.notes=[];S.phase='line';S.play=null;S.evW=null;
  S.result=null;S.over=null;S.level=null;S.sure=false;S.gen=++GEN;
}
function nextLine(S,line){
  resetState(S,line||pick(S.pool,S.prevKey));
  S.count++;
  S.msg={k:'',t:S.side==='w'?'Du hast Weiß. Finde den ersten Zug.':'Du hast Schwarz. Weiß beginnt …'};
  if(S.kind==='game')saveGame(S);
  Eng.init().catch(()=>{});
  paint(S);
  opponent(S);
}
function bookMoves(S){
  // alle eigenen Repertoirezüge in dieser Stellung (über alle Linien derselben Eröffnung)
  const h=S.game.history();const set=new Map();
  OP[S.line.op].L.forEach(l=>{
    if(l.moves.length>h.length&&h.every((m,i)=>l.moves[i]===m)){if(!set.has(l.moves[h.length]))set.set(l.moves[h.length],l)}
  });
  return set;
}
const expected=S=>S.line.moves[S.ply];
function userTurn(S){
  if(!S.line||S.busy)return false;
  const g=S.game;
  if(S.phase==='line')return !S.finished&&g.turn()===S.side&&S.ply<S.line.moves.length;
  if(S.phase==='play')return g.turn()===S.side&&S.play.left>0&&!g.game_over();
  if(S.phase==='game')return g.turn()===S.side&&!S.over&&!g.game_over();
  return false;
}

function opponent(S){
  if(S.ply>=S.line.moves.length){finish(S);return}
  if(S.game.turn()===S.side){paint(S);return}
  S.busy=true;const gen=S.gen;
  setTimeout(()=>{
    if(gen!==S.gen)return;
    const san=expected(S);
    animateMove(S,san,()=>{
      if(gen!==S.gen)return;
      const m=S.game.move(san);S.last=[m.from,m.to];S.ply++;
      const n=S.line.notes[S.ply-1];
      if(n)S.notes.push({who:'Gegner',san:m.san,t:n});
      S.busy=false;
      if(S.kind==='game')saveGame(S);
      if(S.ply>=S.line.moves.length){finish(S);return}
      S.msg={k:'you',t:'Gegner spielt '+de(m.san)+'. Dein Zug.'};
      paint(S);
    });
  },S.ply===0?650:420);
}

function tryMove(from,to){
  const S=T;
  if(!userTurn(S))return;
  if(S.phase==='play'){playMove(S,from,to);return}
  if(S.phase==='game'){gameMove(S,from,to);return}
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.game.undo();
  const book=bookMoves(S);
  const pk=S.line.op+'|'+S.game.fen().split(' ').slice(0,4).join(' ');
  P.pos[pk]=P.pos[pk]||{err:0,ok:0,op:S.line.op,h:S.game.history()};
  if(book.has(m.san)){
    if(expected(S)!==m.san){ // anderer Buchzug -> passende Linie übernehmen
      const h=S.game.history();
      const alt=OP[S.line.op].L.filter(l=>l.moves.length>h.length&&h.every((x,i)=>l.moves[i]===x)&&l.moves[h.length]===m.san);
      S.line=pick(alt);
    }
    S.game.move(m.san);S.last=[m.from,m.to];S.ply++;S.sel=null;
    P.pos[pk].ok++;P.tot.ok++;
    const n=S.line.notes[S.ply-1];
    S.notes=n?[{who:'Du',san:m.san,t:n}]:[];
    S.msg={k:'ok',t:(S.errHere?'Jetzt stimmt’s: ':'Richtig: ')+de(m.san)};
    S.errHere=0;S.hintLvl=0;
    save();
    if(S.kind==='game')saveGame(S);
    renderTrainer();flash(m.to,'right');
    opponent(S);
  }else{
    S.lineErr++;S.errHere++;S.errAt.add(S.ply);
    P.pos[pk].err++;P.tot.err++;save();
    S.sel=null;
    const exp=S.game.move(expected(S));S.game.undo();
    const lvl=Math.min(3,S.errHere);
    S.hintLvl=Math.max(S.hintLvl,lvl>=2?lvl-1:0);
    const t=S.errHere===1?de(m.san)+' ist nicht die Theorie hier. Nochmal!'
      :S.errHere===2?'Auch nicht. Tipp: Gesucht ist ein '+PNAME[exp.piece]+'zug.'
      :S.errHere===3?'Die richtige Figur ist jetzt markiert.'
      :'Noch nicht – du kannst dir den Zug zeigen lassen.';
    S.msg={k:'err',t};
    renderTrainer();flash(to,'wrong');
    const bw=inView('.boardwrap');if(bw){bw.classList.remove('shake');void bw.offsetWidth;bw.classList.add('shake')}
  }
}
function hint(){
  const S=T;
  if(S.phase!=='line'||!userTurn(S))return;
  S.hintUsed=true;
  S.hintLvl=Math.min(2,S.hintLvl+1);
  const exp=S.game.move(expected(S));S.game.undo();
  S.msg={k:'err',t:S.hintLvl===1?'Tipp: Gesucht ist ein '+PNAME[exp.piece]+'zug.':'Tipp: Diese Figur ist dran.'};
  renderTrainer();
}
function show(){
  const S=T;
  if(S.phase!=='line'||!userTurn(S))return;
  S.shown=true;S.errAt.add(S.ply);S.busy=true;
  const san=expected(S),gen=S.gen;
  animateMove(S,san,()=>{
    if(gen!==S.gen)return;
    const m=S.game.move(san);S.last=[m.from,m.to];S.ply++;S.busy=false;
    const n=S.line.notes[S.ply-1];
    S.notes=n?[{who:'Lösung',san:m.san,t:n}]:[];
    S.msg={k:'err',t:'Der Zug war '+de(m.san)+'. Merk ihn dir – die Linie kommt bald wieder.'};
    S.errHere=0;S.hintLvl=0;
    if(S.kind==='game')saveGame(S);
    paint(S);
    opponent(S);
  });
}
function finish(S){
  S.finished=true;
  if(S.kind==='game'){
    S.phase='pick';S.notes=[];
    S.msg={k:'ok',t:'Eröffnung geschafft! Wähle jetzt, wie stark der Bot spielen soll.'};
    saveGame(S);paint(S);
    const gen=S.gen,fen=S.game.fen();
    Eng.analyse(fen).then(a=>{if(gen!==S.gen||S.phase!=='pick')return;setEval(S,a,fen);paint(S)}).catch(()=>{});
    return;
  }
  const s=Object.assign({},LS(S.line.key));
  const perfect=S.lineErr===0&&!S.hintUsed&&!S.shown;
  s.seen++;s.last=Date.now();
  if(perfect){s.box=Math.min(5,s.box+1);s.perfect++}
  else s.box=S.shown?0:Math.max(0,s.box-1);
  P.lines[S.line.key]=s;
  const d=today();P.days[d]=(P.days[d]||0)+1;
  save();
  S.result={perfect,box:s.box};
  startPlay(S);
}

/* ---------- Üben: 2 Züge gegen Stockfish nach der Linie ---------- */
const PLAY_MOVES=2;
function setEval(S,a,fen){ // a = Analyse der Stellung fen; speichert Bewertung aus Sicht von Weiß
  const cp=cpOf(a);S.evW=fen.split(' ')[1]==='w'?cp:-cp;
}
function startPlay(S){
  const gen=S.gen;
  S.phase='play';S.busy=true;
  S.play={left:PLAY_MOVES,moves:[],pre:null,pv:null,pvFen:null,failed:false};
  S.msg={k:'',t:'Jetzt '+PLAY_MOVES+' Züge gegen Stockfish – ohne Theorie, jeder Zug wird bewertet.'};
  paint(S);
  const fen=S.game.fen();
  Eng.analyse(fen).then(a=>{
    if(gen!==S.gen)return;
    setEval(S,a,fen);
    if(S.game.turn()!==S.side)botMove(S,a);
    else{S.play.pre=a;S.busy=false;S.msg={k:'you',t:'Dein Zug – finde den besten Plan.'};paint(S)}
  }).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
}
function botMove(S,a){
  const gen=S.gen;
  if(!a.best){endPlay(S);return}
  const san=uciToMove(S.game.fen(),a.best).san;
  S.busy=true;
  setTimeout(()=>animateMove(S,san,()=>{
    if(gen!==S.gen)return;
    const m=S.game.move(san);S.last=[m.from,m.to];
    S.msg={k:'',t:'Stockfish spielt '+de(m.san)+' …'};
    paint(S);
    if(S.game.game_over()){endPlay(S);return}
    const fen=S.game.fen();
    Eng.analyse(fen).then(b=>{
      if(gen!==S.gen)return;
      setEval(S,b,fen);S.play.pre=b;S.busy=false;
      S.msg={k:'you',t:'Stockfish spielt '+de(m.san)+'. Dein Zug'+(S.play.left===1?' – der letzte.':'.')};
      paint(S);
    }).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
  }),350);
}
function playMove(S,from,to){
  const gen=S.gen;
  const before=S.game.fen(),pre=S.play.pre;
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.last=[m.from,m.to];S.sel=null;S.busy=true;S.play.left--;
  S.msg={k:'',t:'Stockfish prüft '+de(m.san)+' …'};
  paint(S);
  const fen=S.game.fen();
  const done=a=>{
    if(gen!==S.gen)return;
    const uci=m.from+m.to+(m.promotion||'');
    const bestCp=cpOf(pre);
    // Liegt der Zug unter Stockfishs Top-3, zählt dessen Wert aus derselben Suche (weniger Rauschen)
    const after=uci in pre.cand?pre.cand[uci]:a?-cpOf(a):(S.game.in_checkmate()?10000:0); // aus Sicht des Spielers
    const isBest=pre.best===uci;
    const loss=Math.max(0,bestCp-after);
    const r=isBest?[0,'Bester Zug','best']:RATE.find(x=>loss<=x[0]);
    const bestSan=!isBest&&loss>15&&pre.best?de(uciToMove(before,pre.best).san):null;
    S.play.moves.push({san:m.san,label:r[1],cls:r[2],loss,bestSan,after});
    if(a)setEval(S,a,fen);else S.evW=S.side==='w'?after:-after;
    if(live(S))flash(m.to,r[2]==='best'||r[2]==='good'||r[2]==='ok'?'right':'wrong');
    S.msg={k:r[2]==='inacc'||r[2]==='bad'?'err':'ok',t:de(m.san)+': '+r[1]+(bestSan?' – besser war '+bestSan:'')};
    if(!a||S.game.game_over()||S.play.left<=0){S.play.pv=a?a.pv:null;S.play.pvFen=fen;endPlay(S);return}
    paint(S);
    botMove(S,a);
  };
  if(S.game.game_over()){done(null);return}
  Eng.analyse(fen).then(done).catch(()=>{if(gen!==S.gen)return;S.play.failed=true;endPlay(S)});
}
function endPlay(S){
  S.phase='end';S.busy=false;
  paint(S);
}

/* ---------- Partie: Eröffnung nach Theorie, dann freie Partie gegen den Bot ---------- */
const LEVELS=[
  {n:'Anfänger',d:'macht viele Fehler',skill:0,depth:1,ms:100},
  {n:'Gelegenheitsspieler',d:'übersieht oft Taktik',skill:3,depth:3,ms:200},
  {n:'Vereinsspieler',d:'solide, mit Schwächen',skill:7,depth:6,ms:300},
  {n:'Fortgeschritten',d:'spielt sauber',skill:11,depth:10,ms:500},
  {n:'Stark',d:'kaum Fehler',skill:15,depth:14,ms:800},
  {n:'Meister',d:'sehr stark',skill:18,depth:18,ms:1200},
  {n:'Maximum',d:'volle Stockfish-Stärke',j:'Empfehlung: Beten',skill:20,depth:30,ms:1800}];
function startGame(id){
  const S=TG,L=OP[id].L;
  S.pool=L;S.count=0;T=S;
  nextLine(S,L[Math.floor(Math.random()*L.length)]); // der Bot wählt eine zufällige Variante
  if(location.hash!=='#partie')location.hash='#partie';else route();
}
function quitGame(S){clearGame();S.line=null;S.gen=++GEN;S.busy=false;paint(S)}
function chooseLevel(S,i){
  S.level=i;S.phase='game';saveGame(S);
  if(S.game.turn()!==S.side)gameBot(S);
  else{S.msg={k:'you',t:'Du bist am Zug. Viel Erfolg!'};paint(S)}
}
function gameMove(S,from,to){
  const m=S.game.move({from,to,promotion:'q'});
  if(!m){S.sel=null;renderBoard();return}
  S.last=[m.from,m.to];S.sel=null;S.sure=false;saveGame(S);
  if(checkOver(S))return;
  gameBot(S);
}
function gameBot(S){
  const gen=S.gen,L=LEVELS[S.level],fen=S.game.fen(),t0=Date.now();
  S.busy=true;S.msg={k:'',t:'Der Bot denkt …'};paint(S);
  Eng.analyse(fen,{ms:L.ms,depth:L.depth,skill:L.skill,multipv:1}).then(a=>{
    if(gen!==S.gen)return;
    setEval(S,a,fen);
    if(!a.best){S.busy=false;checkOver(S);return}
    const san=uciToMove(fen,a.best).san;
    setTimeout(()=>animateMove(S,san,()=>{
      if(gen!==S.gen)return;
      const m=S.game.move(san);S.last=[m.from,m.to];S.busy=false;saveGame(S);
      if(checkOver(S))return;
      S.msg={k:'you',t:'Bot spielt '+de(m.san)+(S.game.in_check()?' – Schach!':'.')+' Dein Zug.'};
      paint(S);
    }),Math.max(0,450-(Date.now()-t0)));
  }).catch(()=>{if(gen!==S.gen)return;S.busy=false;S.msg={k:'err',t:'Der Bot konnte nicht geladen werden (keine Verbindung?).'};paint(S)});
}
function checkOver(S,resigned){
  const g=S.game;let res=null,why='';
  if(resigned){res='loss';why='Aufgegeben'}
  else if(g.in_checkmate()){res=g.turn()===S.side?'loss':'win';why='Schachmatt'}
  else if(g.in_stalemate()){res='draw';why='Patt'}
  else if(g.in_threefold_repetition()){res='draw';why='Dreifache Stellungswiederholung'}
  else if(g.insufficient_material()){res='draw';why='Zu wenig Material zum Mattsetzen'}
  else if(g.in_draw()){res='draw';why='50-Züge-Regel'}
  if(!res)return false;
  S.over={res,why,id:Date.now()};S.busy=false;S.phase='over';S.sel=null;S.anaDone=false;
  if(why==='Schachmatt')S.evW=(res==='win')===(S.side==='w')?10000:-10000;
  P.games=P.games||[];
  P.games.push({id:S.over.id,d:today(),op:S.line.op,v:S.line.name,lvl:S.level,res,n:Math.ceil(g.history().length/2),moves:g.history(),side:S.side,book:S.line.moves.length});
  if(P.games.length>200)P.games=P.games.slice(-200);
  P.days[today()]=(P.days[today()]||0)+1;
  save();clearGame();
  S.msg={k:res==='loss'?'err':res==='win'?'ok':'',t:{win:'Gewonnen',loss:'Verloren',draw:'Remis'}[res]+' – '+why+'.'};
  paint(S);
  return true;
}
// laufende Partie überlebt Neuladen und App-Wechsel
function saveGame(S){
  if(!S.line||S.phase==='over')return;
  try{localStorage.setItem(SK+'-game',JSON.stringify({key:S.line.key,op:S.line.op,moves:S.game.history(),phase:S.phase,level:S.level}))}catch(e){}
}
function clearGame(){try{localStorage.removeItem(SK+'-game')}catch(e){}}
function restoreGame(){
  let g=null;try{g=JSON.parse(localStorage.getItem(SK+'-game')||'null')}catch(e){}
  if(!g||!OP[g.op])return;
  const line=OP[g.op].L.find(l=>l.key===g.key);if(!line){clearGame();return}
  const S=TG;S.pool=OP[g.op].L;resetState(S,line);S.count=1;
  for(const m of g.moves)if(!S.game.move(m)){clearGame();S.line=null;return}
  const h=S.game.history({verbose:true}),lm=h[h.length-1];if(lm)S.last=[lm.from,lm.to];
  S.ply=Math.min(g.moves.length,line.moves.length);
  S.phase=g.phase;S.level=g.level;S.finished=g.phase!=='line';
  S.msg={k:'you',t:'Deine Partie geht weiter.'};
  if(S.phase==='line')opponent(S);
  else if(S.phase==='pick')finish(S);
  else if(S.phase==='game'){
    if(S.game.turn()!==S.side)gameBot(S);
    else{const gen=S.gen,fen=S.game.fen();Eng.analyse(fen,{ms:800}).then(a=>{if(gen!==S.gen)return;setEval(S,a,fen);paint(S)}).catch(()=>{})}
  }
}

const FILES='abcdefgh';
const inView=sel=>document.querySelector('#'+T.view+' '+sel);
const boardEl=()=>inView('.board');
function squares(){
  const out=[];
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rank=T.side==='w'?8-r:r+1, file=T.side==='w'?f:7-f;
    out.push(FILES[file]+rank);
  }
  return out;
}
function renderBoard(){
  const el=boardEl();if(!el)return;
  const g=T.game, sqs=squares();
  let hintSq=null;
  if(T.phase==='line'&&userTurn(T)&&T.hintLvl>=2){const e=g.move(expected(T));g.undo();hintSq=e.from}
  let checkSq=null;
  if(g.in_check())sqs.forEach(s=>{const p=g.get(s);if(p&&p.type==='k'&&p.color===g.turn())checkSq=s});
  const tg=new Map();
  if(T.sel)g.moves({square:T.sel,verbose:true}).forEach(m=>tg.set(m.to,!!m.captured));
  el.innerHTML=sqs.map((s,i)=>{
    const fi=FILES.indexOf(s[0]),ri=+s[1];
    const light=(fi+ri)%2===1;
    const p=g.get(s);
    let c='sq '+(light?'l':'d');
    if(T.last&&T.last.includes(s))c+=' last';
    if(T.sel===s)c+=' sel';
    if(hintSq===s)c+=' hint';
    if(checkSq===s)c+=' chk';
    if(tg.has(s))c+=' tgt'+(tg.get(s)?' cap':'');
    const col=i%8, row=Math.floor(i/8);
    return '<div class="'+c+'" data-s="'+s+'">'+
      (row===7?'<span class="co f">'+s[0]+'</span>':'')+(col===0?'<span class="co r">'+s[1]+'</span>':'')+
      (p?'<span class="pc '+p.color+'">'+GLYPH[p.type]+'︎</span>':'')+'</div>';
  }).join('');
}
function sqEl(s){return inView('.sq[data-s="'+s+'"]')}
function flash(s,k){const e=sqEl(s);if(!e)return;e.classList.add(k);setTimeout(()=>e.classList.remove(k),900)}
function animateMove(S,san,done){
  if(!live(S)){done();return}
  const m=S.game.move(san);S.game.undo();
  const a=sqEl(m.from),b=sqEl(m.to);
  const pc=a&&a.querySelector('.pc');
  if(!pc||!b){done();return}
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  pc.style.transform='translate('+(rb.left-ra.left)+'px,'+(rb.top-ra.top)+'px)';
  pc.style.zIndex=5;
  setTimeout(done,240);
}
function squareAt(x,y){
  const el=boardEl();if(!el)return null;
  const r=el.getBoundingClientRect();
  if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return null;
  const c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  return squares()[w*8+c];
}
let drag=null;
function onDown(e){
  const s=squareAt(e.clientX,e.clientY);if(!s||!userTurn(T))return;
  const p=T.game.get(s);
  if(T.sel&&s!==T.sel&&!(p&&p.color===T.side)){tryMove(T.sel,s);return}
  if(!p||p.color!==T.side){T.sel=null;renderBoard();return}
  e.preventDefault();
  const wasSel=T.sel===s;
  T.sel=s;renderBoard();
  const src=sqEl(s).querySelector('.pc');
  const ghost=src.cloneNode(true);ghost.classList.add('drag');
  ghost.style.fontSize=getComputedStyle(src).fontSize;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  document.body.appendChild(ghost);src.classList.add('lift');
  drag={from:s,ghost,src,wasSel,moved:false,x:e.clientX,y:e.clientY};
}
window.addEventListener('pointermove',e=>onMove(e));
window.addEventListener('pointerup',e=>onUp(e));
window.addEventListener('pointercancel',e=>onUp(e));
function onMove(e){
  if(!drag)return;
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>6)drag.moved=true;
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
}
function onUp(e){
  if(!drag)return;
  const d=drag;drag=null;d.ghost.remove();d.src.classList.remove('lift');
  const s=squareAt(e.clientX,e.clientY);
  if(s&&s!==d.from){tryMove(d.from,s);return}
  if(!d.moved&&d.wasSel){T.sel=null}
  renderBoard();
}

function miniBoard(o){
  const g=new Chess();o.fig.split(' ').forEach(m=>g.move(m));
  const b=g.board(),h=g.history({verbose:true}),lm=h[h.length-1];
  let out='';
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rr=o.side==='w'?r:7-r,ff=o.side==='w'?f:7-f,p=b[rr][ff],sq=FILES[ff]+(8-rr);
    out+='<i class="'+((rr+ff)%2===0?'l':'d')+(lm&&(lm.from===sq||lm.to===sq)?' lm':'')+'">'+(p?'<b class="'+p.color+'">'+GLYPH[p.type]+'︎</b>':'')+'</i>';
  }

}
function userCp(){return T.evW===null?0:(T.side==='w'?T.evW:-T.evW)}
function evBar(){
  const cp=userCp(),wp=100/(1+Math.pow(10,-Math.max(-2000,Math.min(2000,cp))/400));
  const lbl=T.evW===null?'':fmtEv(cp);
  return '<div class="evbar'+(T.side==='b'?' flip':'')+'" title="Bewertung aus deiner Sicht"><i style="height:'+wp.toFixed(1)+'%"></i>'+
    (lbl?'<span class="'+(cp>=0?'lo':'hi')+'">'+lbl+'</span>':'')+'</div>';
}
function verdictText(cp){
  return Math.abs(cp)<40?'Ausgeglichen':cp>0?(cp<150?'Du stehst etwas besser':cp<400?'Du stehst klar besser':'Du stehst auf Gewinn'):(cp>-150?'Der Gegner steht etwas besser':cp>-400?'Der Gegner steht klar besser':'Der Gegner steht auf Gewinn');

/* ---------- Partie-Analyse ---------- */
// Bewertungsklassen im Stil von chess.com: Symbol + Farbe + Name (nie nur Farbe)
const CLS={
  brill:{s:'!!',n:'Brillant',c:'#2ec4e8'},
  great:{s:'!',n:'Sehr guter Zug',c:'#3b6fd4'},
  best:{s:'!',n:'Bester Zug',c:'#5cc48d'},
  good:{s:'✓',n:'Gut',c:'#8fa878'},
  book:{s:'≡',n:'Theorie',c:'#a8855f'},
  inacc:{s:'?!',n:'Ungenauigkeit',c:'#f0a020'},
  mist:{s:'?',n:'Fehler',c:'#e8692c'},
  blund:{s:'??',n:'Patzer',c:'#d93a30'}};
const CLS_ORDER=['brill','great','best','good','book','inacc','mist','blund'];
const ANA_MS=700;
// Gewinnchance in % aus Sicht der Seite am Zug (Formel wie bei Lichess)
const winp=cp=>50+50*(2/(1+Math.exp(-0.00368208*Math.max(-2000,Math.min(2000,cp))))-1);
const accOf=drop=>Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*drop)-3.1669));
function matOf(g,c){let s=0;g.board().forEach(r=>r.forEach(p=>{if(p&&p.type!=='k')s+=(p.color===c?1:-1)*VAL[p.type]}));return s}
const gameById=id=>(P.games||[]).find(x=>x.id===id);

let AJ=null; // laufende Analyse {id,i,n,cancel}
function analyseGame(id){
  const g=gameById(id);if(!g||!g.moves||AJ)return;
  const job={id,i:0,n:g.moves.length+1,cancel:false};AJ=job;
  const c=new Chess(),fens=[c.fen()],ucis=[];
  g.moves.forEach(m=>{const x=c.move(m);ucis.push(x.from+x.to+(x.promotion||''));fens.push(c.fen())});
  const res=[];
  paintA();
  const step=()=>{
    if(job.cancel){AJ=null;paintA();return}
    if(job.i>=fens.length){finishAnalysis(g,fens,ucis,res);AJ=null;paintA(true);return}
    const fen=fens[job.i],pos=new Chess(fen);
    if(pos.game_over()){res.push({cp:pos.in_checkmate()?-10000:0,best:null,second:null,pv:[]});job.i++;paintA();step();return}
    Eng.analyse(fen,{ms:ANA_MS,multipv:2}).then(a=>{
      const cands=Object.values(a.cand).sort((x,y)=>y-x);
      res.push({cp:cpOf(a),best:a.best,second:cands.length>1?cands[1]:null,pv:(a.pv||[]).slice(0,2)});
      job.i++;paintA();step();
    }).catch(()=>{AJ=null;job.err=true;anaErr='Stockfish konnte nicht geladen werden (keine Verbindung?).';paintA(true)});
  };
  step();
}
let anaErr='';
function finishAnalysis(g,fens,ucis,res){
  const n=ucis.length,cls=[],drops=[];
  for(let i=0;i<n;i++){
    const before=res[i].cp,after=-res[i+1].cp;
    const wb=winp(before),wa=winp(after),drop=Math.max(0,wb-wa);
    let k;
    if(i<(g.book||0))k='book';
    else if(drop>=22)k='blund';
    else if(drop>=12)k='mist';
    else if(drop>=5)k='inacc';
    else{
      const isBest=ucis[i]===res[i].best||drop<=1;
      // Opfer: nach der besten Antwort des Gegners und unserer besten Rückantwort fehlt Material – und trotzdem steht man gut
      let sac=false;
      if(isBest&&wa>=45&&wb<=92){
        const c=new Chess(fens[i]),me=c.turn(),m0=matOf(c,me);
        c.move(g.moves[i]);
        for(const u of res[i+1].pv){if(!c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'}))break}
        sac=m0-matOf(c,me)>=2;
      }
      // einziger guter Zug: die zweitbeste Möglichkeit wäre deutlich schlechter gewesen
      const only=isBest&&res[i].second!==null&&wb-winp(res[i].second)>=15;
      k=sac?'brill':only?'great':isBest?'best':'good';
    }
    cls.push(k);drops.push(k==='book'?null:drop);
  }
  const acc=side=>{const d=drops.filter((x,i)=>x!==null&&(i%2===0?'w':'b')===side);return d.length?Math.round(d.reduce((s,x)=>s+accOf(x),0)/d.length):null};
  const opp=g.side==='w'?'b':'w';
  g.an={ev:res.map((r,i)=>{const cp=fens[i].split(' ')[1]==='w'?r.cp:-r.cp;return Math.max(-10000,Math.min(10000,cp))}),
    cls:cls.join(','),best:res.map(r=>r.best||''),acc:acc(g.side),accBot:acc(opp),
    blund:cls.filter((k,i)=>k==='blund'&&(i%2===0?'w':'b')===g.side).length};
  save();
}

function resBadge(r){return '<span class="rb '+r+'">'+{win:'S',draw:'R',loss:'N'}[r]+'</span>'}
const fmtDate=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.':'';

      :'<p class="small muted">Noch keine Partie – spiel eine im Tab „Partie“.</p>')+'</div>';
  v.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{progView=b.dataset.pv;renderProgress(v)});

// Ein-Reihen-Liniendiagramm über die analysierten Partien (x = Partie-Nr.)
function progChart(an){
  const W=340,H=150,L=28,R=8,Tp=10,B=22;
  const vals=an.map(x=>progView==='acc'?x.an.acc:(x.an.blund||0));
  const max=progView==='acc'?100:Math.max(3,...vals);
  const X=i=>L+(an.length===1?0:i*(W-L-R)/(an.length-1)),Y=v=>Tp+(1-v/max)*(H-Tp-B);
  const ticks=progView==='acc'?[0,50,100]:[0,Math.round(max/2),max];
  let s='<svg class="pchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(progView==='acc'?'Genauigkeit':'Patzer')+' pro Partie">';
  ticks.forEach(t=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="tick" x="'+(L-6)+'" y="'+(Y(t)+3.5)+'" text-anchor="end">'+t+(progView==='acc'?'':'')+'</text>'});
  s+='<text class="tick" x="'+L+'" y="'+(H-6)+'">Partie 1</text><text class="tick" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+an.length+'</text>';
  s+='<polyline class="ln" points="'+vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+'"/>';
  vals.forEach((v,i)=>{s+='<circle class="dot" cx="'+X(i)+'" cy="'+Y(v)+'" r="4"/>'});
  s+='<line class="xh" id="pxh" y1="'+Tp+'" y2="'+(H-B)+'" x1="-9" x2="-9"/></svg><div class="tip" id="ptip" hidden></div>';
  return '<div class="chartwrap" data-n="'+an.length+'" data-l="'+L+'" data-r="'+R+'" data-w="'+W+'">'+s+'</div>';
}
function bindChart(v,an){
  const wrap=v.querySelector('.chartwrap');if(!wrap)return;
  const svg=wrap.querySelector('svg'),tip=wrap.querySelector('#ptip'),xh=wrap.querySelector('#pxh');
  const L=+wrap.dataset.l,R=+wrap.dataset.r,W=+wrap.dataset.w,n=an.length;
  const move=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(n-1,Math.round((x-L)/((W-L-R)/Math.max(1,n-1)))));
    const g=an[i],px=L+(n===1?0:i*(W-L-R)/(n-1));
    xh.setAttribute('x1',px);xh.setAttribute('x2',px);
    tip.hidden=false;
    tip.innerHTML='<b>Partie '+(i+1)+'</b> · '+esc(OP[g.op]?OP[g.op].name:'')+'<br>'+(progView==='acc'?g.an.acc+' % Genauigkeit':(g.an.blund||0)+' Patzer')+' · '+{win:'Sieg',draw:'Remis',loss:'Niederlage'}[g.res];
    const left=px/W*r.width;tip.style.left=Math.max(0,Math.min(r.width-180,left-90))+'px';
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('x1',-9);xh.setAttribute('x2',-9)});
  svg.addEventListener('click',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(n-1,Math.round((x-L)/((W-L-R)/Math.max(1,n-1)))));location.hash='#analyse/'+an[i].id});
}

  const cur=v.querySelector('.mvb.cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'});
  bindEvGraph(v,g);
}
function posFen(g,i){const c=new Chess();for(let j=0;j<i;j++)c.move(g.moves[j]);return c.fen()}
// Bewertungsverlauf: Fläche = deine Gewinnchance, Punkte = Fehler/Patzer
function evGraph(g){
  const an=g.an,n=an.ev.length-1,W=520,H=90,cls=an.cls.split(',');
  const X=i=>n?i*W/n:0,Y=cp=>H-winp(g.side==='w'?cp:-cp)/100*H;
  let d='M0,'+H+' '+an.ev.map((cp,i)=>'L'+X(i).toFixed(1)+','+Y(cp).toFixed(1)).join(' ')+' L'+W+','+H+' Z';
  let s='<svg class="egraph" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Bewertungsverlauf der Partie"><rect width="'+W+'" height="'+H+'" class="eb"/><path d="'+d+'" class="ea"/>'+
    '<line x1="0" x2="'+W+'" y1="'+H/2+'" y2="'+H/2+'" class="em"/>'+
    '<line x1="'+X(TA.k)+'" x2="'+X(TA.k)+'" y1="0" y2="'+H+'" class="ec"/></svg>';
  let dots='';
  cls.forEach((k,i)=>{if(['mist','blund','brill','great'].includes(k))dots+='<i style="left:'+(X(i+1)/W*100)+'%;top:'+(Y(an.ev[i+1])/H*100)+'%;background:'+CLS[k].c+'"></i>'});
  return '<div class="egwrap">'+s+'<div class="egdots">'+dots+'</div><div class="tip" id="etip" hidden></div></div>';
}
function bindEvGraph(v,g){
  const w=v.querySelector('.egwrap');if(!w)return;
  const n=g.moves.length,tip=w.querySelector('#etip'),cls=g.an.cls.split(',');
  const at=e=>{const r=w.getBoundingClientRect();return Math.max(0,Math.min(n,Math.round((e.clientX-r.left)/r.width*n)))};
  w.addEventListener('pointermove',e=>{const k=at(e),r=w.getBoundingClientRect();tip.hidden=false;
    const ucp=g.side==='w'?g.an.ev[k]:-g.an.ev[k];
    tip.innerHTML=k?'<b>'+(Math.floor((k-1)/2)+1)+((k-1)%2?'…':'.')+' '+esc(de(g.moves[k-1]))+'</b> '+CLS[cls[k-1]].s+'<br>'+fmtEv(ucp):'Start · '+fmtEv(ucp);
    tip.style.left=Math.max(0,Math.min(r.width-130,(e.clientX-r.left)-65))+'px'});
  w.addEventListener('pointerleave',()=>{tip.hidden=true});
  w.addEventListener('click',e=>reviewGo(at(e)));
}

const SB_URL='https://fjpvqmnzwmnghbebyfwd.supabase.co',SB_KEY='sb_publishable_Xdu2ISD5JAqX1mePr3K2bg_j0Vq-hFO',AKEY='eroeffnungstrainer.auth';
let auth=(()=>{try{const a=JSON.parse(localStorage.getItem(AKEY)||'null');return a&&a.user&&a.refresh_token?a:null}catch(e){return null}})();
let refreshing=null,authMsg='',syncOn=false,dirty=false,flushing=false,again=false,ft=null;
const SYNC={ok:'Gesichert',saving:'Speichert …',loading:'Lädt …',local:'Nicht angemeldet',error:'Nicht gesichert, neuer Versuch folgt'};
function setSync(st){const el=$('#sync');el.dataset.s=st;$('#syncText').textContent=SYNC[st]||''}
function saveAuth(){try{if(auth)localStorage.setItem(AKEY,JSON.stringify(auth));else localStorage.removeItem(AKEY)}catch(e){}}
function sbFetch(path,method,body,tok,extra){
  const hd={apikey:SB_KEY,'Content-Type':'application/json'};if(tok)hd.Authorization='Bearer '+tok;if(extra)Object.assign(hd,extra);
  const bs=body?JSON.stringify(body):undefined;
  return fetch(SB_URL+path,{method,headers:hd,body:bs,keepalive:!!bs&&bs.length<60000}).then(r=>r.text().then(t=>{
    let j=null;try{j=t?JSON.parse(t):null}catch(e){}
    if(!r.ok){const er=new Error((j&&(j.msg||j.error_description||j.message))||('Fehler '+r.status));er.status=r.status;er.code=j&&(j.error_code||j.code||j.error);throw er}
    return j}));
}
function setSession(j){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:+j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600),user:{id:j.user.id,email:j.user.email}};saveAuth()}
function signedOut(msg){auth=null;saveAuth();syncOn=false;dirty=false;clearTimeout(ft);setSync('local');authMsg=msg||'';route()}
function token(){
  if(!auth)return Promise.reject(new Error('abgemeldet'));
  if(auth.expires_at-Date.now()/1000>90)return Promise.resolve(auth.access_token);
  if(!refreshing)refreshing=sbFetch('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:auth.refresh_token}).then(j=>{setSession(j);refreshing=null;return auth.access_token},
    e=>{refreshing=null;if(e.status===400||e.status===401||e.status===403)signedOut('Deine Anmeldung ist abgelaufen. Bitte melde dich neu an.');throw e});
  return refreshing;
}
function rest(method,path,body,extra,retried){
  return token().then(t=>sbFetch('/rest/v1/'+path,method,body,t,extra)).catch(e=>{
    if(e.status===401&&!retried&&auth){auth.expires_at=0;return rest(method,path,body,extra,true)}throw e});
}
function authErr(e){
  if(!e.status)return 'Keine Verbindung zum Server. Bitte später erneut versuchen.';
  const m={invalid_credentials:'E-Mail oder Passwort stimmt nicht.',email_not_confirmed:'Bitte öffne zuerst den Link in der Bestätigungs-E-Mail.',user_already_exists:'Für diese Adresse gibt es schon ein Konto. Melde dich an.',
    weak_password:'Das Passwort ist zu schwach. Nimm ein längeres.',over_email_send_rate_limit:'Zu viele E-Mails in kurzer Zeit. Bitte später erneut versuchen.',over_request_rate_limit:'Zu viele Versuche. Bitte kurz warten.',
    email_address_invalid:'Diese E-Mail-Adresse wird nicht angenommen.',signup_disabled:'Neue Konten sind in Supabase gerade abgeschaltet.',email_address_not_authorized:'Supabase darf an diese Adresse keine Bestätigungs-E-Mail senden.'};
  return m[e.code]||e.message||'Das hat nicht geklappt.';
}
// Zwei Fortschrittsstände zusammenführen: nichts geht verloren, egal auf welchem Gerät trainiert wurde.
function mergeP(a,b){
  const ra=a.resetAt||0,rb=b.resetAt||0;
  if(ra!==rb){const w=ra>rb?a:b;return Object.assign(emptyP(),JSON.parse(JSON.stringify(w)))}
  const o=emptyP();if(ra)o.resetAt=ra;
  const keys=(x,y)=>new Set([...Object.keys(x||{}),...Object.keys(y||{})]);
  keys(a.lines,b.lines).forEach(k=>{const x=(a.lines||{})[k],y=(b.lines||{})[k];
    o.lines[k]=!x?y:!y?x:((y.seen>x.seen||(y.seen===x.seen&&y.last>x.last))?y:x)});
  keys(a.pos,b.pos).forEach(k=>{const x=(a.pos||{})[k],y=(b.pos||{})[k];
    o.pos[k]=!x?y:!y?x:Object.assign({},x,{err:Math.max(x.err,y.err),ok:Math.max(x.ok,y.ok)})});
  keys(a.days,b.days).forEach(k=>{o.days[k]=Math.max((a.days||{})[k]||0,(b.days||{})[k]||0)});
  o.tot={ok:Math.max(a.tot?.ok||0,b.tot?.ok||0),err:Math.max(a.tot?.err||0,b.tot?.err||0)};
  const gm=new Map();[...(a.games||[]),...(b.games||[])].forEach(g=>{const x=gm.get(g.id);if(!x||(!x.an&&g.an))gm.set(g.id,g)});
  o.games=[...gm.values()].sort((x,y)=>x.id-y.id).slice(-200);
  return o;
}
function scheduleFlush(){if(!syncOn)return;setSync('saving');clearTimeout(ft);ft=setTimeout(sync,800)}
// holen, zusammenführen, hochladen
function sync(){
  if(!syncOn)return;
  if(flushing){again=true;return}
  flushing=true;dirty=false;setSync(document.querySelector('#sync').dataset.s==='local'?'loading':'saving');
  const uid=auth.user.id;
  rest('GET','eroeffnungen_docs?select=data&key=eq.progress').then(rows=>{
    const remote=rows&&rows[0]&&rows[0].data;
    if(remote){
      const before=JSON.stringify(P);P=mergeP(P,remote);
      if(JSON.stringify(P)!==before){saveLocal();refreshViews()}
      if(JSON.stringify(P)===JSON.stringify(mergeP(remote,remote)))return;
    }
    return rest('POST','eroeffnungen_docs?on_conflict=user_id,key',{user_id:uid,key:'progress',data:P,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});
  }).then(()=>{flushing=false;if(again||dirty){again=false;scheduleFlush()}else setSync('ok')},
    ()=>{flushing=false;if(!syncOn)return;dirty=true;setSync('error');clearTimeout(ft);ft=setTimeout(sync,20000)});
}
function refreshViews(){
  const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
  if(!$('#v-liste').hidden)renderList();if(!$('#v-stats').hidden)renderStats();if(!$('#v-analyse').hidden&&!AJ)renderAnalyse();
}

  const uid=auth.user.id;let owner=null;try{owner=localStorage.getItem(SK+'-owner')}catch(e){}

}

function bindKonto(){

function kontoAct(act,b){
  const am=$('#accMsg');
  if(act==='login'||act==='signup'){
    const em=$('#accMail').value.trim(),pw=$('#accPw').value;
    if(!em||pw.length<6){am.textContent='Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.';return}
    b.disabled=true;am.textContent='Einen Moment …';
    (act==='login'?sbFetch('/auth/v1/token?grant_type=password','POST',{email:em,password:pw})
      :sbFetch('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),'POST',{email:em,password:pw}))
    .then(j=>{
      if(j&&j.access_token){setSession(j);authMsg='';startCloud()}
      else if(j&&j.identities&&j.identities.length===0)authMsg='Für diese Adresse gibt es schon ein Konto. Melde dich an.';
      else authMsg='Fast fertig: Öffne den Link in der E-Mail an '+em+' und melde dich danach hier an.';
      renderStats();
    },e=>{b.disabled=false;am.textContent=authErr(e)});
  }else if(act==='logout'){
    if(syncOn&&(dirty||flushing)){am.textContent='Es ist noch nicht alles gesichert. Bitte kurz warten und noch einmal abmelden.';clearTimeout(ft);sync();return}
    const ot=auth&&auth.access_token;if(ot)sbFetch('/auth/v1/logout','POST',null,ot).catch(()=>{});
    P=emptyP();saveLocal();try{localStorage.removeItem(SK+'-owner')}catch(e){}
    signedOut('Abgemeldet. Dein Fortschritt bleibt auf dem Server.');
  }
}
// Rückkehr aus der Bestätigungs-E-Mail: Supabase hängt die Sitzung an die Adresse an
function fromEmailLink(){
  const h=location.hash.slice(1);if(!/access_token=|error_description=/.test(h))return;
  const q=new URLSearchParams(h);

    setSession({access_token:tk,refresh_token:q.get('refresh_token'),expires_at:q.get('expires_at'),expires_in:q.get('expires_in'),user:u});
